                                <h5 class="font-bold text-white text-[10px] truncate">${cardObj.title}</h5>
                                <p class="text-[8px] text-primary font-semibold mt-0.5">${cardObj.type === 'movie' ? '🎬 فيلم' : '📺 مسلسل'}</p>
                            </div>
                        </div>
                    `;
                } else {
                    contentHtml = `<p class="text-[10px] font-bold text-red-400">عنصر مشترك مفقود</p>`;
                }
            } else {
                contentHtml = `<p class="text-xs leading-normal">${Views.escapeHtml(msg.content)}</p>`;
            }
            
            let reactionsHtml = '';
            if (msg.messageType !== 'deleted' && msg.reactions && msg.reactions.length > 0) {
                const counts = {};
                msg.reactions.forEach(r => counts[r.emoji] = (counts[r.emoji] || 0) + 1);
                reactionsHtml = `
                    <div class="flex flex-row-reverse gap-1 mt-1 flex-wrap">
                        ${Object.keys(counts).map(emoji => `
                            <span onclick="Views.reactToMessage('${msg.id}', '${emoji}')" class="bg-white/10 backdrop-blur-md border border-white/5 rounded-full px-1.5 py-0.5 text-[10px] cursor-pointer hover:bg-white/20 select-none transition-all">${emoji} <span class="text-[8px] opacity-80">${counts[emoji]}</span></span>
                        `).join('')}
                    </div>
                `;
            }
            
            let seenHtml = '';
            if (isMe && msg.seenBy && msg.seenBy.length > 0) {
                seenHtml = `
                    <div class="text-[8px] text-gray-500 mt-0.5 flex items-center justify-end gap-0.5">
                        <i class="fa-solid fa-check-double text-primary text-[8px]"></i>
                        <span>شوهد</span>
                    </div>
                `;
            } else if (isMe) {
                seenHtml = `
                    <div class="text-[8px] text-gray-500 mt-0.5 flex items-center justify-end gap-0.5">
                        <i class="fa-solid fa-check text-[8px]"></i>
                        <span>أُرسل</span>
                    </div>
                `;
            }
            
            const rowClass = isMe ? 'justify-end' : 'justify-start';
            const bubbleClass = isMe 
                ? 'bg-gradient-to-l from-primary to-[#16ab72] text-black rounded-r-2xl rounded-tl-2xl shadow-[0_3px_10px_rgba(27,214,142,0.15)]' 
                : 'bg-white/5 border border-white/10 text-white rounded-l-2xl rounded-tr-2xl';
                
            const formattedTime = new Date(msg.createdAt).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
            
            let actionButtonsHtml = '';
            if (msg.messageType !== 'deleted') {
                actionButtonsHtml += `
                    <button onclick="Views.setDrawerReplyingTo('${msg.id}', '${msg.senderName || msg.senderUsername}', '${msg.messageType === 'text' ? msg.content.replace(/'/g, "\\'") : 'ملف وسائط'}')" class="opacity-0 group-hover:opacity-100 transition-opacity hover:text-white" title="رد">
                        <i class="fa-solid fa-reply text-[10px]"></i>
                    </button>
                `;
                
                if (isMe && Views.canDeleteMessage(msg)) {
                    actionButtonsHtml += `
                        <button onclick="Views.deleteMessage('${msg.id}')" class="opacity-0 group-hover:opacity-100 transition-opacity hover:text-red-700 ml-1.5" title="حذف">
                            <i class="fa-solid fa-trash-can text-[10px]"></i>
                        </button>
                    `;
                }
            }
            
            const reactionPickerHtml = (msg.messageType !== 'deleted') ? `
                <div class="absolute top-1/2 -translate-y-1/2 ${isMe ? 'left-full ml-1' : 'right-full mr-1'} opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-card border border-white/10 rounded-full px-1.5 py-0.5 flex gap-1 z-30 shadow-xl hidden md:flex">
                    ${['❤️', '👍', '😂', '😮', '😢', '🔥'].map(emoji => `

            return `

                    <div class="max-w-[80%] flex flex-col text-right animate-fade-in">
                        ${(!isMe && msg.senderName) ? `<span class="text-[8px] text-gray-500 font-bold mb-0.5 mr-1.5">${msg.senderName}</span>` : ''}
                        
                        <div class="p-3 ${bubbleClass} relative select-text transition-all duration-300">
                            ${replyHtml}
                            ${contentHtml}

        Views.bindSwipeToReply = function(rowEl, msgId, senderName, contentText, isDrawer = false) {
            let startX = 0;
            let currentX = 0;
            let isSwiping = false;
            const bubble = rowEl.querySelector('.rounded-tr-2xl, .rounded-tl-2xl, .rounded-tr-3xl, .rounded-tl-3xl');
            if (!bubble) return;
            
            let indicator = rowEl.querySelector('.swipe-reply-indicator');
            if (!indicator) {
                indicator = document.createElement('div');
                indicator.className = 'swipe-reply-indicator absolute left-[-40px] top-1/2 -translate-y-1/2 opacity-0 text-primary transition-all duration-200 z-10';
                indicator.innerHTML = '<i class="fa-solid fa-reply text-lg"></i>';
                rowEl.appendChild(indicator);
            }
            
            rowEl.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                isSwiping = true;
                bubble.style.transition = 'none';
                indicator.style.transition = 'none';
            }, { passive: true });
            
            rowEl.addEventListener('touchmove', (e) => {
                if (!isSwiping) return;
                const diffX = e.touches[0].clientX - startX;
                
                if (diffX > 0) {
                    currentX = Math.min(diffX, 80);
                    const translation = currentX * 0.75;
                    bubble.style.transform = `translateX(${translation}px)`;
                    
                    indicator.style.left = `${translation - 30}px`;
                    const opacity = Math.min(translation / 40, 1);
                    indicator.style.opacity = opacity;
                    indicator.style.transform = `translateY(-50%) scale(${0.8 + opacity * 0.4})`;
                    
                    if (translation >= 40) {
                        indicator.style.color = '#1bd68e';
                    } else {
                        indicator.style.color = '#9ca3af';
                    }
                }
            }, { passive: true });
            
            rowEl.addEventListener('touchend', (e) => {
                if (!isSwiping) return;
                isSwiping = false;
                
                const finalTranslation = currentX * 0.75;
                bubble.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                indicator.style.transition = 'all 0.3s ease';
                
                bubble.style.transform = '';
                indicator.style.opacity = '0';
                indicator.style.left = '-40px';
                
                if (finalTranslation >= 40) {
                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate(30);
                    }
                    if (isDrawer) {
                        Views.setDrawerReplyingTo(msgId, senderName, contentText);
                    } else {
                        Views.setReplyingTo(msgId, senderName, contentText);
                    }
                }
                currentX = 0;
            });
        };

        Views.setDrawerReplyingTo = function(messageId, username, contentText) {
            Views.drawerReplyingToMsgId = messageId;
            const bar = document.getElementById('drawer-reply-preview');
            const userEl = document.getElementById('drawer-reply-username');
            const textEl = document.getElementById('drawer-reply-text');
            
            userEl.innerText = username;
            textEl.innerText = contentText;
            bar.classList.remove('hidden');
            document.getElementById('drawer-chat-input').focus();
        };

        Views.cancelDrawerReply = function() {
            Views.drawerReplyingToMsgId = null;
            const bar = document.getElementById('drawer-reply-preview');
            if (bar) bar.classList.add('hidden');
        };

        Views.sendDrawerMessage = async function() {
            const input = document.getElementById('drawer-chat-input');
            if (!input) return;
            const text = input.value.trim();
            if (!text && !Views.drawerPendingMediaAttachment) return;
            
            const payload = {
                senderId: currentSession.userId,
                messageType: 'text',
                content: text
            };
            
            if (Views.drawerReplyingToMsgId) {
                payload.replyToId = Views.drawerReplyingToMsgId;
            }
            
            if (Views.drawerPendingMediaAttachment) {
                payload.messageType = 'media';
                payload.content = JSON.stringify(Views.drawerPendingMediaAttachment);
                Views.drawerPendingMediaAttachment = null;
            }
            
            input.value = '';
            Views.cancelDrawerReply();
            Views.handleDrawerMessageInputInput();
            
            try {
                const res = await fetch(`${API_BASE}/social/conversations/${Views.drawerCurrentConversationId}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    Views.loadDrawerConversations();
                }
            } catch (e) {
                console.error('Error sending message from drawer', e);
            }
        };

        Views.handleDrawerMessageInputInput = function() {
            if (!Views.drawerCurrentConversationId) return;
            
            if (!Views.drawerIsTyping) {
                Views.drawerIsTyping = true;
                window.socket.emit('typing', {
                    conversationId: Views.drawerCurrentConversationId,
                    userId: currentSession.userId,
                    username: currentSession.name || currentSession.username,
                    isTyping: true
                });
            }
            
            clearTimeout(Views.drawerIsTypingTimeout);
            Views.drawerIsTypingTimeout = setTimeout(() => {
                Views.drawerIsTyping = false;
                window.socket.emit('typing', {
                    conversationId: Views.drawerCurrentConversationId,
                    userId: currentSession.userId,
                    username: currentSession.name || currentSession.username,
                    isTyping: false
                });
            }, 3000);
        };

        Views.toggleDrawerAttachment = function() {
            const menu = document.getElementById('drawer-attachment-menu');
            if (menu) menu.classList.toggle('hidden');
        };

        Views.triggerDrawerImageUpload = function() {
            const input = document.getElementById('drawer-image-file-input');
            if (input) input.click();
            Views.toggleDrawerAttachment();
        };

        Views.handleDrawerImageUpload = async function(input) {
            if (!input.files || input.files.length === 0) return;
            const file = input.files[0];
            
            const formData = new FormData();
            formData.append('image', file);
            formData.append('type', 'chat');
            
            const msgInput = document.getElementById('drawer-chat-input');
            msgInput.placeholder = 'جاري رفع الصورة...';
            msgInput.disabled = true;
            
            try {
                const res = await fetch(`${API_BASE}/social/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.success) {
                    const payload = {
                        senderId: currentSession.userId,
                        messageType: 'image',
                        content: data.filePath
                    };
                    
                    if (Views.drawerReplyingToMsgId) {
                        payload.replyToId = Views.drawerReplyingToMsgId;
                        Views.cancelDrawerReply();
                    }
                    
                    await fetch(`${API_BASE}/social/conversations/${Views.drawerCurrentConversationId}/messages`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    Views.loadDrawerConversations();
                }
            } catch (e) {
                console.error('Error uploading drawer image', e);
            } finally {
                msgInput.placeholder = 'اكتب رسالة...';
                msgInput.disabled = false;
                input.value = '';
            }
        };

        Views.openDrawerShareMedia = function() {
            Views.isDrawerSharing = true;
            Views.toggleDrawerAttachment();
            Views.openShareMediaModal();
        };

        Views.deleteMessage = async function(messageId) {
            if (!confirm('هل أنت متأكد من رغبتك في حذف هذه الرسالة؟')) return;
            
            try {
                const res = await fetch(`${API_BASE}/social/messages/${messageId}/delete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentSession.userId })
                });
                
                const data = await res.json();
                if (data.success) {
                    showAlert('تم حذف الرسالة بنجاح');
                    if (Views.currentConversationId) {
                        Views.loadConversations();
                        Views.loadMessages(Views.currentConversationId);
                    }
                    if (Views.drawerCurrentConversationId) {
                        Views.loadDrawerConversations();
                        Views.loadDrawerMessages(Views.drawerCurrentConversationId);
                    }
                    Views.updateUnreadCount();
                } else {
                    showAlert(data.error || 'فشل حذف الرسالة', 'error');
                }
            } catch (e) {
                console.error(e);
                showAlert('حدث خطأ في الاتصال بالخادم', 'error');
            }
        };

        Views.handleMessageDeleted = function({ messageId }) {
            const mainRow = document.querySelector(`#chat-messages .message-row[data-message-id="${messageId}"]`);
            if (mainRow) {
                const bubble = mainRow.querySelector('.rounded-tr-3xl, .rounded-tl-3xl');
                if (bubble) {
                    bubble.innerHTML = `<p class="text-xs italic opacity-60 flex items-center gap-1.5 justify-end"><i class="fa-solid fa-ban text-[10px]"></i> <span>تم حذف هذه الرسالة</span></p>`;
                    const actionContainer = bubble.querySelector('.flex.items-center.gap-2');
                    if (actionContainer) actionContainer.remove();
                }
                const reactionPicker = mainRow.querySelector('.absolute.top-1\\/2');
                if (reactionPicker) reactionPicker.remove();
                const reactionBadge = mainRow.querySelector('.flex-row-reverse');
                if (reactionBadge) reactionBadge.remove();
            }
            
            const drawerRow = document.querySelector(`#drawer-chat-messages .message-row[data-message-id="${messageId}"]`);
            if (drawerRow) {
                const bubble = drawerRow.querySelector('.rounded-tr-2xl, .rounded-tl-2xl');
                if (bubble) {
                    bubble.innerHTML = `<p class="text-[10px] italic opacity-60 flex items-center gap-1 justify-end"><i class="fa-solid fa-ban text-[8px]"></i> <span>تم حذف هذه الرسالة</span></p>`;
                    const actionContainer = bubble.querySelector('.flex.items-center.gap-1\\.5');
                    if (actionContainer) actionContainer.remove();
                }
                const reactionPicker = drawerRow.querySelector('.absolute.top-1\\/2');
                if (reactionPicker) reactionPicker.remove();
                const reactionBadge = drawerRow.querySelector('.flex-row-reverse');
                if (reactionBadge) reactionBadge.remove();
            }
            
            if (Views.currentConversationId) {
                Views.loadConversations();
            }
            if (Views.drawerCurrentConversationId) {
                Views.loadDrawerConversations();
            }
            Views.updateUnreadCount();
        };

        Views.updateUnreadCount = async function() {
            if (!currentSession || !currentSession.userId) return;
            
            try {
                const [convsRes, reqsRes] = await Promise.all([
                    fetch(`${API_BASE}/social/conversations?userId=${currentSession.userId}`),
                    fetch(`${API_BASE}/social/requests?userId=${currentSession.userId}`)
                ]);
                
                const convs = await convsRes.json();
                const requests = await reqsRes.json();
                
                const unreadMsgs = convs.reduce((acc, c) => acc + (c.unreadCount || 0), 0);
                const pendingReqs = requests.length;
                
                const sidebarReqsBadge = document.getElementById('sidebar-requests-badge');
                if (sidebarReqsBadge) {
                    if (pendingReqs > 0) {
                        sidebarReqsBadge.innerText = pendingReqs;
                        sidebarReqsBadge.classList.remove('hidden');
                    } else {
                        sidebarReqsBadge.classList.add('hidden');
                    }
                }
                
                const drawerReqsBadge = document.getElementById('drawer-requests-badge');
                if (drawerReqsBadge) {
                    if (pendingReqs > 0) {
                        drawerReqsBadge.innerText = pendingReqs;
                        drawerReqsBadge.classList.remove('hidden');
                    } else {
                        drawerReqsBadge.classList.add('hidden');
                    }
                }
                
                const floatingBadge = document.getElementById('floating-unread-badge');
                const totalUnread = unreadMsgs + pendingReqs;
                if (floatingBadge) {
                    if (totalUnread > 0) {
                        floatingBadge.innerText = totalUnread;
                        floatingBadge.classList.remove('hidden');
                    } else {
                        floatingBadge.classList.add('hidden');
                    }
                }
            } catch (e) {
                console.error('Error updating unread count', e);
            }
        };

        Views.bootstrapSocial = function() {
            if (!currentSession || !currentSession.userId) {
                const bubble = document.getElementById('floating-chat-bubble');
                if (bubble) bubble.classList.add('hidden');
                return;
            }
            
            const bubble = document.getElementById('floating-chat-bubble');
            if (bubble) bubble.classList.remove('hidden');
            
            if (!window.socket) {
                window.socket = io();
                
                window.socket.on('new_message', (msg) => {
                    Views.handleIncomingMessage(msg);
                    Views.handleIncomingDrawerMessage(msg);
                    Views.updateUnreadCount();
                });
                
                window.socket.on('message_notification', (data) => {
                    Views.updateUnreadCount();
                    if (Views.currentConversationId) Views.loadConversations();
                    if (Views.drawerCurrentConversationId) Views.loadDrawerConversations();
                });
                
                window.socket.on('message_reaction_updated', (data) => {
                    Views.handleReactionUpdate(data);
                    Views.handleDrawerReactionUpdate(data);
                });
                
                window.socket.on('message_seen_updated', (data) => {
                    Views.handleSeenUpdate(data);
                    Views.handleDrawerSeenUpdate(data);
                });
                
                window.socket.on('user_typing', (data) => {
                    Views.handleTypingUpdate(data);
                    Views.handleDrawerTypingUpdate(data);
                });
                
                window.socket.on('new_conversation', (data) => {
                    Views.loadConversations();
                    Views.loadDrawerConversations();
                    Views.updateUnreadCount();
                });
                
                window.socket.on('message_deleted', (data) => {
                    Views.handleMessageDeleted(data);
                });
                
                window.socket.on('follow_request_received', (data) => {
                    Views.updateUnreadCount();
                    if (document.getElementById('requests-list') && !document.getElementById('requests-list').classList.contains('hidden')) {
                        Views.loadFollowRequests();
                    }
                    if (document.getElementById('drawer-requests-list') && !document.getElementById('drawer-requests-list').classList.contains('hidden')) {
                        Views.loadDrawerFollowRequests();
                    }
                    showAlert('لديك طلب متابعة جديد!');
                });
                
                window.socket.on('follow_request_accepted', (data) => {
                    Views.updateUnreadCount();
                    Views.loadConversations();
                    Views.loadDrawerConversations();
                    showAlert('تم قبول طلب المتابعة الخاص بك!');
                });
            }
            
            window.socket.emit('join_user', currentSession.userId);
            Views.updateUnreadCount();
        };

        Views.handleIncomingDrawerMessage = function(msg) {
            if (!Views.drawerCurrentConversationId) return;
            
            if (msg.conversationId === Views.drawerCurrentConversationId) {
                const container = document.getElementById('drawer-chat-messages');
                if (container) {
                    if (container.querySelector('.text-gray-500')) {
                        container.innerHTML = '';
                    }
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = Views.renderDrawerMessageRow(msg);
                    const rowEl = tempDiv.firstElementChild;
                    container.appendChild(rowEl);
                    container.scrollTop = container.scrollHeight;
                    
                    Views.bindSwipeToReply(rowEl, msg.id, msg.senderName || msg.senderUsername, msg.messageType === 'text' ? msg.content : 'ملف وسائط', true);
                    
                    if (msg.senderId !== currentSession.userId) {
                        fetch(`${API_BASE}/social/messages/${msg.id}/seen`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: currentSession.userId })
                        });
                    }
                }
            }
        };

        Views.handleDrawerReactionUpdate = function({ messageId, reactions }) {
            const row = document.querySelector(`#drawer-chat-messages .message-row[data-message-id="${messageId}"]`);
            if (row) {
                let badgeContainer = row.querySelector('.flex-row-reverse');
                if (reactions.length === 0) {
                    if (badgeContainer) badgeContainer.remove();
                    return;
                }
                
                const counts = {};
                reactions.forEach(r => counts[r.emoji] = (counts[r.emoji] || 0) + 1);
                const newHtml = `
                    <div class="flex flex-row-reverse gap-1 mt-1 flex-wrap">
                        ${Object.keys(counts).map(emoji => `
                            <span onclick="Views.reactToMessage('${messageId}', '${emoji}')" class="bg-white/10 backdrop-blur-md border border-white/5 rounded-full px-1.5 py-0.5 text-[10px] cursor-pointer hover:bg-white/20 select-none transition-all">${emoji} <span class="text-[8px] opacity-80">${counts[emoji]}</span></span>
                        `).join('')}
                    </div>
                `;
                
                if (badgeContainer) {
                    badgeContainer.outerHTML = newHtml;
                } else {
                    const bubbleWrapper = row.firstElementChild;
                    const bubble = bubbleWrapper.querySelector('.rounded-tr-2xl, .rounded-tl-2xl');
                    bubble.insertAdjacentHTML('afterend', newHtml);
                }
            }
        };

        Views.handleDrawerSeenUpdate = function({ messageId, seenBy }) {
            const row = document.querySelector(`#drawer-chat-messages .message-row[data-message-id="${messageId}"]`);
            if (row) {
                const seenStatusContainer = row.querySelector('.text-\\[8px\\]');
                if (seenStatusContainer && seenBy.length > 0) {
                    seenStatusContainer.innerHTML = `
                        <i class="fa-solid fa-check-double text-primary text-[8px]"></i>
                        <span>شوهد</span>
                    `;
                }
            }
        };

        Views.handleDrawerTypingUpdate = function({ conversationId, userId, username, isTyping }) {
            if (Views.drawerCurrentConversationId !== conversationId) return;
            
            const indicator = document.getElementById('drawer-typing-indicator');
            if (!indicator) return;
            
            if (isTyping) {
                indicator.innerText = `${username} يكتب الآن...`;
                indicator.classList.remove('hidden');
            } else {
                indicator.classList.add('hidden');
            }
        };

        Views.searchUserDrawer = async function() {
            const input = document.getElementById('drawer-user-search');
            if (!input) return;
            const username = input.value.trim();
            if (!username) return;
            
            const container = document.getElementById('drawer-search-results');
            container.innerHTML = `<div class="flex justify-center py-3"><div class="w-4 h-4 border-2 border-primary border-t-transparent rounded-full animate-spin"></div></div>`;
            container.classList.remove('hidden');
            
            try {
                const res = await fetch(`${API_BASE}/social/search?username=${encodeURIComponent(username)}&currentUserId=${currentSession.userId}`);
                if (!res.ok) {
                    const errData = await res.json();
                    container.innerHTML = `<div class="text-red-500 font-bold text-[10px] text-center py-1.5">${errData.error || 'المستخدم غير موجود'}</div>`;
                    return;
                }
                
                const data = await res.json();
                const u = data.user;
                const status = data.followStatus;
                
                let actionButton = '';
                if (status === 'mutual') {
                    actionButton = `<button onclick="Views.startDrawerDirectChat('${u.id}')" class="bg-primary hover:bg-white text-black font-bold text-[10px] py-1 px-3 rounded-lg transition-all">دردشة</button>`;
                } else if (status === 'following_only' || status === 'pending_sent') {
                    actionButton = `<button onclick="Views.unfollowUserDrawer('${u.id}')" class="bg-white/10 hover:bg-red-500/20 hover:text-red-500 text-white font-bold text-[10px] py-1 px-3 rounded-lg transition-all">${status === 'pending_sent' ? 'معلق (إلغاء)' : 'إلغاء'}</button>`;
                } else {
                    actionButton = `<button onclick="Views.followUserDrawer('${u.id}')" class="bg-primary hover:bg-white text-black font-bold text-[10px] py-1 px-3 rounded-lg transition-all">متابعة</button>`;
                }
                
                const displayAvatar = u.isBlurred 
                    ? `<div class="w-8 h-8 rounded-lg overflow-hidden relative"><img src="${u.avatar || '/uploads/users/default.png'}" class="w-full h-full object-cover filter blur-[12px] pointer-events-none"></div>`
                    : `<img src="${u.avatar || '/uploads/users/default.png'}" class="w-8 h-8 rounded-lg object-cover">`;
                    
                const displayName = u.name;
                const displayUsername = u.isBlurred ? 'مجهول' : `@${u.username}`;
                
                container.innerHTML = `
                    <div class="flex items-center justify-between p-2 rounded-xl bg-white/5 border border-white/10 text-right">
                        <div class="flex items-center gap-2">
                            ${displayAvatar}
                            <div class="text-right">
                                <h5 class="font-bold text-white text-xs">${displayName}</h5>
                                <p class="text-[9px] text-gray-400">${displayUsername}</p>
                            </div>
                        </div>
                        ${actionButton}
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `<div class="text-red-500 font-bold text-[10px] text-center py-1.5">حدث خطأ أثناء البحث</div>`;
            }
        };

        Views.followUserDrawer = async function(targetId) {
            try {
                const res = await fetch(`${API_BASE}/social/follow`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ followerId: currentSession.userId, followingId: targetId })
                });
                const data = await res.json();
                if (data.success) {
                    Views.searchUserDrawer();
                    Views.loadDrawerConversations();
                    Views.updateUnreadCount();
                    if (data.isMutual) {
                        Views.startDrawerDirectChat(targetId);
                    }
                }
            } catch (error) {
                console.error(error);
            }
        };

        Views.unfollowUserDrawer = async function(targetId) {
            try {
                const res = await fetch(`${API_BASE}/social/unfollow`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ followerId: currentSession.userId, followingId: targetId })
                });
                const data = await res.json();
                if (data.success) {
                    Views.searchUserDrawer();
                    Views.loadDrawerConversations();
                    Views.updateUnreadCount();
                }
            } catch (error) {
                console.error(error);
            }
        };

        Views.startDrawerDirectChat = async function(targetId) {
            try {
                const res = await fetch(`${API_BASE}/social/conversations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        isGroup: false,
                        createdById: currentSession.userId,
                        members: [currentSession.userId, targetId]
                    })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('drawer-user-search').value = '';
                    document.getElementById('drawer-search-results').classList.add('hidden');
                    await Views.selectDrawerConversation(data.conversationId);
                }
            } catch (error) {
                console.error(error);
            }
        };

        if (typeof currentSession !== 'undefined' && currentSession) {
            setTimeout(() => {
                Views.bootstrapSocial();
            }, 100);
        }

        const PlayerEngine = {
            player: null,

            currentSubtitle: null,
            currentQuality: 'auto',
            activeTimeouts: [],
            currentVidId: null,
            keyboardShortcuts: {
                'space': 'playPause',
                'ArrowRight': 'skipForward',
                'ArrowLeft': 'skipBackward',
                'ArrowUp': 'volumeUp',
                'ArrowDown': 'volumeDown',
                'f': 'fullscreen',
                'm': 'mute',
                'p': 'pictureInPicture',
                '>': 'speedUp',
                '<': 'speedDown',
                '0': 'restart',
                'c': 'toggleSubtitles'
            },

            init() {
                const vidId = document.querySelector('[data-vid]')?.dataset.vid;
                if (!vidId) return;


                this.activeTimeouts.forEach(t => clearTimeout(t));
                this.activeTimeouts = [];
                this.currentVidId = vidId;

                this.setupPlayer(vidId);
                this.fetchUserState(vidId);
                this.loadSubtitles(vidId);
                this.setupKeyboardControls();
                this.setupGestures();
                this.loadSuggestions();
            },

            async fetchUserState(vidId) {
                const s = currentSession || {};
                if (!s.userId) return;

                const vidData = document.querySelector('[data-vid]');
                const type = vidData?.dataset.type;
                const seriesId = vidData?.dataset.series;
                const targetId = (type === 'episode' && seriesId) ? seriesId : vidId;

                try {
                    const url = type === 'episode' ? `/api/user/state/${targetId}?userId=${s.userId}&episodeId=${vidId}` : `/api/user/state/${targetId}?userId=${s.userId}`;
                    const res = await fetch(url);
                    const state = await res.json();
                    if (this.currentVidId !== vidId) return;

                    const btnLike = document.getElementById('btn-like');
                    const iconLike = document.getElementById('icon-like');
                    const btnSave = document.getElementById('btn-save');
                    const iconSave = document.getElementById('icon-save');

                    if (state.isLiked && btnLike) {
                        btnLike.classList.add('bg-primary', 'text-black');
                        btnLike.classList.remove('bg-white/5');
                        iconLike.classList.replace('fa-regular', 'fa-solid');
                    }
                    if (state.isSaved && btnSave) {
                        btnSave.classList.add('bg-primary', 'text-black');
                        btnSave.classList.remove('bg-white/5');
                        iconSave.classList.replace('fa-regular', 'fa-solid');
                    }

                    const isCorrectEpisode = type === 'movie' || (state.episodeId === vidId);

                    if (isCorrectEpisode && ((state.seconds && state.seconds > 5) || (state.progress && state.progress > 0)) && this.player) {
                        let seekAttempts = 0;
                        const maxAttempts = 10;
                        const seekTo = () => {
                            if (!this.player || this.currentVidId !== vidId) return true;
                            const duration = this.player.duration();

                            if (duration && duration > 0 && isFinite(duration)) {
                                let targetTime = state.seconds || (state.progress / 100) * duration;

                                if (targetTime > 0) {
                                    this.player.currentTime(targetTime);
                                    console.log(`[Player] Attempting seek to: ${targetTime}s for ${vidId}`);

                                    const verifyT = setTimeout(() => {
                                        if (this.player && Math.abs(this.player.currentTime() - targetTime) > 5 && seekAttempts < maxAttempts) {
                                            seekAttempts++;
                                            seekTo();
                                        }
                                    }, 500);
                                    this.activeTimeouts.push(verifyT);
                                    return true;
                                }
                            }
                            return false;
                        };

                        this.player.ready(() => {
                            if (this.currentVidId !== vidId) return;
                            if (!seekTo()) {
                                this.player.one('loadedmetadata', seekTo);
                                this.player.one('loadeddata', seekTo);
                                this.player.one('canplay', seekTo);
                                this.player.one('play', seekTo);
                                const t1 = setTimeout(seekTo, 1000);
                                const t2 = setTimeout(seekTo, 3000);
                                this.activeTimeouts.push(t1, t2);
                            }
                        });
                    }
                } catch (e) { console.error('Error fetching state', e); }
            },

            async like() {
                const vidData = document.querySelector('[data-vid]');
                const vidId = vidData?.dataset.vid;
                const type = vidData?.dataset.type;
                UserActions.toggleLike(vidId, type, 'btn-like', 'icon-like', true);
            },

            async save() {
                const vidData = document.querySelector('[data-vid]');
                const vidId = vidData?.dataset.vid;
                const type = vidData?.dataset.type;
                UserActions.toggleSave(vidId, type, 'btn-save', 'icon-save', true);
            },

            loadSuggestions() {
                const vidData = document.querySelector('[data-vid]');
                const seriesId = vidData?.dataset.series;
                const collectionId = vidData?.dataset.collection;
                const currentId = vidData?.dataset.vid;

                Promise.all([
                    fetch(`${API_BASE}/series`).then(r => r.json().catch(() => [])),
                    fetch(`${API_BASE}/movies`).then(r => r.json().catch(() => []))
                ]).then(([series, movies]) => {
                    const allContent = [...(series || []), ...(movies || [])];

                    const filtered = allContent.filter(i => {
                        if (i.id === currentId) return false;
                        if (seriesId && i.id === seriesId) return false;
                        if (collectionId && i.collectionInfo && i.collectionInfo.id === collectionId) return false;
                        return true;
                    })
                        .sort(() => 0.5 - Math.random()) 
                        .slice(0, 15);

                    const trendingGrid = document.getElementById('player-trending-sug');
                    if (trendingGrid) {
                        trendingGrid.innerHTML = filtered.map(item => UI.card(item)).join('');
                    }
                }).catch(e => console.error("", e));
            },

            setupPlayer(vidId) {
                const videoElement = document.getElementById('ultra-v');
                if (!videoElement) return;

                if (this.player) {
                    try { this.player.dispose(); } catch (e) { }
                }

                this.player = videojs('ultra-v', {
                    fluid: true,
                    controls: false,
                    autoplay: true,
                    preload: 'auto',
                    playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2],
                    html5: {
                        vhs: {
                            overrideNative: true,
                            fastQualityChange: true,
                            useBandwidthFromLocalStorage: true
                        },
                        nativeAudioTracks: false,
                        nativeVideoTracks: false
                    },
                    userActions: {
                        hotkeys: true,
                        doubleClick: false
                    }
                });

                this.setupCustomUI(vidId);

                this.player.one('play', () => {
                    fetch(`${API_BASE}/watch/${vidId}`).catch(() => { });
                });

                let lastSync = 0;
                this.nextPromptShown = false;

                this.player.on('timeupdate', () => {
                    const currentTime = this.player.currentTime();
                    const duration = this.player.duration();
                    this.updateCustomProgress();

                    if (currentTime > 5 && duration) {
                        const progress = Math.round((currentTime / duration) * 100);
                        const s = currentSession || {};

                        if (s.userId && (Date.now() - lastSync > 10000)) {
                            this.saveProgressSync(vidId);
                            lastSync = Date.now();
                        }

                        const type = document.querySelector('[data-vid]')?.dataset.type;
                        if (progress >= 90 && type === 'episode' && !this.nextPromptShown) {
                            this.nextPromptShown = true;
                            this.showNextEpisodePrompt(vidId);
                        }
                    }
                });

                this.player.on('pause', () => this.saveProgressSync(vidId));

                const updateIcons = () => {
                    if (!this.player) return;
                    const isPaused = this.player.paused();
                    const centerIcon = document.getElementById('center-play-icon');
                    const bottomIcon = document.getElementById('bottom-play-icon');

                    if (centerIcon) centerIcon.className = isPaused ? 'fa-solid fa-play ml-2' : 'fa-solid fa-pause';
                    if (bottomIcon) bottomIcon.className = isPaused ? 'fa-solid fa-play' : 'fa-solid fa-pause';
                };
                this.player.on('play', () => {
                    updateIcons();
                    this.toggleUI(false); 
                });
                this.player.on('pause', () => {
                    updateIcons();
                    this.toggleUI(true); 
                });
                this.player.on('volumechange', () => this.updateVolumeUI());
                this.player.on('ended', () => { });

                const container = document.getElementById('p-container');
                if (container) {
                    const handleInteraction = () => {
                        if (this.player && !this.player.paused()) {
                            if (!this.uiVisible) this.toggleUI(true);
                            else this.resetInactivityTimer();
                        }
                    };
                    container.addEventListener('mousemove', handleInteraction);
                    container.addEventListener('touchstart', handleInteraction);
                    container.addEventListener('click', () => this.resetInactivityTimer());

                    container.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        this.toggleUI(false);
                    });

                    const zones = {
                        'left': document.getElementById('zone-left'),
                        'right': document.getElementById('zone-right'),
                        'center': document.getElementById('zone-center')
                    };

                    const bindInteraction = (el, zone) => {
                        if (!el) return;
                        const handler = (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            if (zone === 'center') this.handleCenterClick();
                            else this.handleSeekZone(zone);
                        };
                        el.addEventListener('click', handler);
                        el.addEventListener('touchstart', handler, { passive: false });
                    };

                    bindInteraction(zones.left, 'left');
                    bindInteraction(zones.right, 'right');
                    bindInteraction(zones.center, 'center');
                }
            },

            uiVisible: false,
            inactivityTimer: null,

            resetInactivityTimer() {
                clearTimeout(this.inactivityTimer);
                if (this.uiVisible && this.player && !this.player.paused()) {
                    this.inactivityTimer = setTimeout(() => this.toggleUI(false), 3000);
                }
            },

            toggleUI(forceState) {
                const overlay = document.getElementById('player-ui-overlay');
                if (!overlay) return;
                this.uiVisible = forceState !== undefined ? forceState : !this.uiVisible;
                if (this.uiVisible) {
                    overlay.classList.add('show-ui');
                    this.resetInactivityTimer();
                } else {
                    overlay.classList.remove('show-ui');
                }
            },

            lastZoneClick: { time: 0, zone: null },
            handleSeekZone(zone) {
                const now = Date.now();
                if (now - this.lastZoneClick.time < 300 && this.lastZoneClick.zone === zone) {
                    if (zone === 'left') {
                        this.player.currentTime(this.player.currentTime() - 10);
                    } else {
                        this.player.currentTime(this.player.currentTime() + 10);
                    }
                    this.showSeekIndicator(zone);
                    this.lastZoneClick.time = 0;
                    this.lastZoneClick.zone = null;
                } else {
                    this.lastZoneClick = { time: now, zone };
                    setTimeout(() => {
                        if (Date.now() - this.lastZoneClick.time >= 300 && this.lastZoneClick.time !== 0) {
                            this.toggleUI();
                            this.lastZoneClick.time = 0;
                        }
                    }, 310);
                }
            },

            lastCenterClick: 0,
            handleCenterClick() {
                const now = Date.now();
                if (now - this.lastCenterClick < 300) {
                    const isPaused = this.player.paused();
                    this.playPause(true);

                    this.toggleUI(!isPaused);

                    this.lastCenterClick = 0;
                } else {
                    this.lastCenterClick = now;
                    setTimeout(() => {
                        if (Date.now() - this.lastCenterClick >= 300 && this.lastCenterClick !== 0) {
                            this.toggleUI();
                            this.lastCenterClick = 0;
                        }
                    }, 310);
                }
            },

            showSeekIndicator(zone) {
                const el = document.getElementById(`seek-indicator-${zone}`);
                if (el) {
                    el.classList.add('active');
                    setTimeout(() => el.classList.remove('active'), 600);
                }
            },

            showHUD(type, text) {
                const el = document.getElementById(`hud-${type}`);
                const txtEl = document.getElementById(`hud-${type}-text`);
                if (el && txtEl) {
                    txtEl.textContent = text;
                    el.classList.add('visible');
                    clearTimeout(el.timer);
                    el.timer = setTimeout(() => el.classList.remove('visible'), 1500);
                }
            },

            setupCustomUI(vidId) {
                const progressContainer = document.getElementById('custom-progress-container');
                const volSlider = document.getElementById('volume-slider');
                const tooltip = document.getElementById('progress-tooltip');

                let isDraggingProgress = false;
                let isDraggingVolume = false;
                let wasPlaying = false;

                const getClientX = (e) => {
                    if (e.changedTouches && e.changedTouches.length > 0) return e.changedTouches[0].clientX;
                    if (e.touches && e.touches.length > 0) return e.touches[0].clientX;
                    return e.clientX;
                };

                const updateTooltip = (clientX, rect) => {
                    if (!tooltip || !this.player || !this.player.duration()) return null;
                    const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                    const targetTime = pos * this.player.duration();
                    tooltip.textContent = this.formatTime(targetTime);
                    tooltip.style.left = `${pos * 100}%`;
                    tooltip.classList.add('visible');
                    return { pos, targetTime };
                };

                const handleProgress = (e, isLiveScrub = false) => {
                    const rect = progressContainer.getBoundingClientRect();
                    const clientX = getClientX(e);
                    const data = updateTooltip(clientX, rect);
                    if (!data) return;

                    const { pos, targetTime } = data;
                    document.getElementById('custom-progress-bar').style.width = `${pos * 100}%`;
                    document.getElementById('curr-time').textContent = this.formatTime(targetTime);

                    if (isLiveScrub || e.type === 'click') {
                        this.player.currentTime(targetTime);
                    }
                };

                const handleVolume = (e) => {
                    const rect = volSlider.getBoundingClientRect();
                    const clientX = getClientX(e);
                    const vol = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                    this.player.volume(vol);
                    this.updateVolumeUI();
                };

                progressContainer.addEventListener('mousedown', (e) => {
                    isDraggingProgress = true;
                    if (this.player) { wasPlaying = !this.player.paused(); this.player.pause(); }
                    handleProgress(e, true);
                });
                progressContainer.addEventListener('touchstart', (e) => {
                    isDraggingProgress = true;
                    if (this.player) { wasPlaying = !this.player.paused(); this.player.pause(); }
                    handleProgress(e, true);
                }, { passive: true });

                progressContainer.addEventListener('mousemove', (e) => {
                    if (!isDraggingProgress) {
                        const rect = progressContainer.getBoundingClientRect();
                        updateTooltip(e.clientX, rect);
                    }
                });
                progressContainer.addEventListener('mouseleave', () => {
                    if (!isDraggingProgress && tooltip) tooltip.classList.remove('visible');
                });

                volSlider.addEventListener('mousedown', (e) => { isDraggingVolume = true; handleVolume(e); });
                volSlider.addEventListener('touchstart', (e) => { isDraggingVolume = true; handleVolume(e); }, { passive: true });

                window.addEventListener('mousemove', (e) => {
                    if (isDraggingProgress) handleProgress(e, true);
                    if (isDraggingVolume) handleVolume(e);
                });

                window.addEventListener('touchmove', (e) => {
                    if (isDraggingProgress) handleProgress(e, true);
                    if (isDraggingVolume) handleVolume(e);
                }, { passive: true });

                window.addEventListener('mouseup', (e) => {
                    if (isDraggingProgress) {
                        handleProgress(e, true);
                        isDraggingProgress = false;
                        if (wasPlaying && this.player) this.player.play();
                        if (tooltip) tooltip.classList.remove('visible');
                    }
                    isDraggingVolume = false;
                });

                window.addEventListener('touchend', (e) => {
                    if (isDraggingProgress) {
                        handleProgress(e, true);
                        isDraggingProgress = false;
                        if (wasPlaying && this.player) this.player.play();
                        if (tooltip) tooltip.classList.remove('visible');
                    }
                    isDraggingVolume = false;
                });

                progressContainer.onclick = (e) => handleProgress(e, true);
                volSlider.onclick = handleVolume;
            },

            updateCustomProgress() {
                if (!this.player) return;
                const curr = this.player.currentTime();
                const total = this.player.duration();
                const progress = total ? (curr / total) * 100 : 0;

                const progressBar = document.getElementById('custom-progress-bar');
                if (progressBar) progressBar.style.width = `${progress}%`;
                const currTime = document.getElementById('curr-time');
                if (currTime) currTime.textContent = this.formatTime(curr);
                const totalTime = document.getElementById('total-time');
                if (totalTime) totalTime.textContent = this.formatTime(total);
            },

            saveProgressSync(forcedVidId) {
                if (!this.player) return;
                const s = currentSession || {};
                if (!s.userId) return;

                const curr = this.player.currentTime();
                const total = this.player.duration();
                if (!total || curr < 2) return;

                const progress = Math.round((curr / total) * 100);
                const vidData = document.querySelector('[data-vid]');

                const type = vidData?.dataset.type || (forcedVidId ? 'episode' : 'movie');
                const seriesId = vidData?.dataset.series;
                const episodeId = forcedVidId || vidData?.dataset.vid;

                const contentId = (type === 'episode' && seriesId) ? seriesId : episodeId;

                if (!contentId) return;

                const now = Date.now();
                if (this._lastSave && now - this._lastSave < 2000) return;
                this._lastSave = now;

                fetch('/api/user/history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: s.userId,
                        contentId,
                        contentType: type,
                        episodeId: type === 'episode' ? episodeId : null,
                        progress,
                        seconds: curr,
                        isPlaying: !this.player.paused()
                    })
                }).catch(() => { });
            },

            updateVolumeUI() {
                const vol = this.player.volume();
                const muted = this.player.muted();
                const fill = document.getElementById('volume-fill');
                if (fill) fill.style.width = `${muted ? 0 : vol * 100}%`;

                const icon = document.getElementById('volume-icon');
                if (icon) icon.className = (muted || vol === 0) ? 'fa-solid fa-volume-xmark' : (vol < 0.5 ? 'fa-solid fa-volume-low' : 'fa-solid fa-volume-high');

                this.showHUD('volume', `${Math.round(vol * 100)}%`);
            },

            formatTime(seconds) {
                if (isNaN(seconds)) return "00:00";
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            },

            async loadSubtitles(vidId) {
                try {
                    const vidData = document.querySelector('[data-vid]');
                    const seriesId = vidData?.dataset.series;

                    const response = await fetch(`${API_BASE}/series/${seriesId || vidId}`);
                    const content = await response.json();

                    const subtitleUrls = [];

                    if (content.subtitleUrl) {
                        subtitleUrls.push({
                            label: 'العربية',
                            srclang: 'ar',
                            src: content.subtitleUrl,
                            default: true
                        });
                    }

                    if (content.episodes) {
                        const episode = content.episodes.find(ep => ep.id === vidId);
                        if (episode?.subtitleUrl && !subtitleUrls.some(s => s.src === episode.subtitleUrl)) {
                            subtitleUrls.push({
                                label: 'العربية',
                                srclang: 'ar',
                                src: episode.subtitleUrl
                            });
                        }
                    }

                    if (subtitleUrls.length > 0 && this.player) {
                        const trackElement = document.createElement('track');
                        trackElement.kind = 'subtitles';
                        trackElement.label = subtitleUrls[0].label;
                        trackElement.srclang = subtitleUrls[0].srclang;
                        trackElement.src = subtitleUrls[0].src;
                        trackElement.default = true;

                        const videoEl = document.getElementById('ultra-v');
                        videoEl.appendChild(trackElement);

                        this.player.ready(() => {
                            this.player.addRemoteTextTrack({
                                kind: 'subtitles',
                                label: subtitleUrls[0].label,
                                language: subtitleUrls[0].srclang,
                                src: subtitleUrls[0].src,
                                default: true
                            }, true);
                        });
                    }
                } catch (error) {
                    console.error('Error loading subtitles:', error);
                }
            },

            showQualityMenu() {
                const qualities = [
                    { label: 'تلقائي', value: 'auto' },
                    { label: '4K', value: '2160' },
                    { label: '1080p', value: '1080' },
                    { label: '720p', value: '720' },
                    { label: '480p ', value: '480' }
                ];

                const existing = document.querySelector('.custom-menu');
                if (existing) { existing.remove(); return; }

                const menu = document.createElement('div');
                menu.className = 'custom-menu';

                menu.innerHTML = `
            <div class="px-4 py-2 text-gray-500 text-[10px] uppercase font-black tracking-widest border-b border-white/5 mb-2">جودة الفيديو</div>
            ${qualities.map(q => `
                <div class="menu-item ${this.currentQuality === q.value ? 'active' : ''}" onclick="PlayerEngine.setQuality('${q.value}')">
                    <span>${q.label}</span>
                    ${this.currentQuality === q.value ? '<i class="fa-solid fa-check"></i>' : ''}
                </div>
            `).join('')}
        `;

                document.getElementById('p-container').appendChild(menu);
            },

            setQuality(val) {
                this.currentQuality = val;
                this.showNotification(`🎬 جودة: ${val === 'auto' ? 'تلقائي' : val + 'p'}`);
                document.querySelector('.custom-menu')?.remove();
            },

            setupKeyboardControls() {
                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                    const key = e.key;
                    const action = this.keyboardShortcuts[key === ' ' ? 'space' : key];
                    if (action && this.player) {
                        e.preventDefault();
                        const silent = !this.uiVisible;
                        this[action](silent);
                    }
                });
            },

            toggleLock(btn) {
                const isLocked = btn.classList.toggle('active');
                const container = document.getElementById('p-container');
                const topBar = container.querySelector('.player-top-bar');
                const bottomBar = container.querySelector('.player-bottom-bar');
                const centerCtrls = container.querySelector('.netflix-center-controls');

                if (isLocked) {
                    btn.innerHTML = '<i class="fa-solid fa-lock"></i>';
                    topBar.classList.add('locked');
                    bottomBar.classList.add('locked');
                    centerCtrls.classList.add('locked');
                    this.showNotification(' تم قفل الشاشة');
                } else {
                    btn.innerHTML = '<i class="fa-solid fa-lock-open"></i>';
                    topBar.classList.remove('locked');
                    bottomBar.classList.remove('locked');
                    centerCtrls.classList.remove('locked');
                    this.showNotification(' تم فتح الشاشة');
                }
            },

            lastPlayClick: 0,
            playPause(silent = false) {
                const now = Date.now();
                if (now - this.lastPlayClick < 400 && !silent) return; 
                this.lastPlayClick = now;

                if (this.player.paused()) {
                    this.player.play();
                    if (!silent) this.toggleUI(false); 
                } else {
                    this.player.pause();
                    this.toggleUI(true); 
                }
            },

            skipForward(silent = false) {
                this.player.currentTime(this.player.currentTime() + 10);
                this.showSeekIndicator('right');
                if (!silent) this.toggleUI(true);
            },

            skipBackward(silent = false) {
                this.player.currentTime(this.player.currentTime() - 10);
                this.showSeekIndicator('left');
                if (!silent) this.toggleUI(true);
            },

            volumeUp() {
                let volume = this.player.volume();
                volume = Math.min(volume + 0.1, 1);
                this.player.volume(volume);
                this.updateVolumeUI();
            },

            volumeDown() {
                let volume = this.player.volume();
                volume = Math.max(volume - 0.1, 0);
                this.player.volume(volume);
                this.updateVolumeUI();
            },

            fullscreen() {
                const container = document.getElementById('p-container');
                const icon = document.getElementById('full-icon');
                const videoElement = document.getElementById('ultra-v_html5_api') || document.getElementById('ultra-v') || document.querySelector('#ultra-v video');

                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

                if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
                    if (isIOS && videoElement && videoElement.webkitEnterFullscreen) {
                        videoElement.webkitEnterFullscreen();
                        return;
                    } else if (container.requestFullscreen) {
                        container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        container.webkitRequestFullscreen();
                    } else if (container.msRequestFullscreen) {
                        container.msRequestFullscreen();
                    } else if (videoElement && videoElement.webkitEnterFullscreen) {
                        videoElement.webkitEnterFullscreen();
                    }

                    if (icon) icon.className = 'fa-solid fa-compress';

                    setTimeout(() => {
                        container.style.display = 'flex';
                        container.style.alignItems = 'center';
                        container.style.justifyContent = 'center';
                        container.style.background = 'black';

                        if (videoElement) {
                            videoElement.style.objectFit = 'contain';
                            videoElement.style.objectPosition = 'center';
                        }
                    }, 100);
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                    if (icon) icon.className = 'fa-solid fa-expand';

                    setTimeout(() => {
                        container.style.display = '';
                        container.style.alignItems = '';
                        container.style.justifyContent = '';
                    }, 100);
                }
            },

            toggleAspectRatio() {
                const videoElement = document.getElementById('ultra-v_html5_api') || document.querySelector('#ultra-v video.vjs-tech') || document.querySelector('video');
                if (!videoElement) return;

                if (!this.aspectRatio) this.aspectRatio = 'contain';

                let nextRatio = 'contain';
                let label = 'وضع الاحتواء (Fit)';
                let icon = 'fa-expand-arrows-alt';

                if (this.aspectRatio === 'contain') {
                    nextRatio = 'cover';
                    label = 'وضع الملء (Fill)';
                    icon = 'fa-up-right-and-down-left-from-center';
                } else if (this.aspectRatio === 'cover') {
                    nextRatio = 'fill';
                    label = 'وضع التمدد (Stretch)';
                    icon = 'fa-maximize';
                } else {
                    nextRatio = 'contain';
                    label = 'وضع الاحتواء (Fit)';
                    icon = 'fa-expand-arrows-alt';
                }

                this.aspectRatio = nextRatio;
                videoElement.style.setProperty('object-fit', nextRatio, 'important');

                const iconEl = document.getElementById('ratio-icon');
                if (iconEl) iconEl.className = `fa-solid ${icon}`;

                this.showNotification(label);
            },

            mute() {
                this.player.muted(!this.player.muted());
                this.updateVolumeUI();
                this.showNotification(this.player.muted() ? ' كتم الصوت' : ' تشغيل الصوت');
            },

            pictureInPicture() {
                const video = document.querySelector('video');
                if (document.pictureInPictureEnabled) {
                    if (document.pictureInPictureElement) {
                        document.exitPictureInPicture();
                        this.showNotification('إلغاء صورة داخل صورة');
                    } else if (video) {
                        video.requestPictureInPicture();
                        this.showNotification('وضع صورة داخل صورة');
                    }
                }
            },

            speedUp() {
                let rate = this.player.playbackRate();
                rate = Math.min(rate + 0.25, 2);
                this.player.playbackRate(rate);
                this.showNotification(`سرعة ${rate}x`);
            },

            speedDown() {
                let rate = this.player.playbackRate();
                rate = Math.max(rate - 0.25, 0.5);
                this.player.playbackRate(rate);
                this.showNotification(`سرعة ${rate}x`);
            },

            restart() {
                this.player.currentTime(0);
                this.player.play();
                this.showNotification('إعادة التشغيل');
            },

            toggleSubtitles() {
                if (!this.player) return;

                const tracks = this.player.textTracks();
                if (!tracks || tracks.length === 0) return;

                let anyVisible = false;
                for (let i = 0; i < tracks.length; i++) {
                    if (tracks[i].mode === 'showing') {
                        tracks[i].mode = 'hidden';
                        anyVisible = true;
                    } else if (tracks[i].mode === 'hidden') {
                        tracks[i].mode = 'showing';
                        anyVisible = true;
                        break;
                    }
                }

                this.showNotification(anyVisible ? 'إظهار الترجمة' : 'إخفاء الترجمة');
            },

            showNotification(text) {
                const notification = document.createElement('div');
                notification.className = 'player-notification';
                notification.style.cssText = `
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #1bd68e;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 1000;
            border: 2px solid #1bd68e;
            backdrop-filter: blur(10px);
            animation: notificationFade 2s ease forwards;
        `;
                notification.textContent = text;

                const style = document.createElement('style');
                style.textContent = `
            @keyframes notificationFade {
                0% { opacity: 0; transform: translate(-50%, -20px); }
                10% { opacity: 1; transform: translate(-50%, 0); }
                90% { opacity: 1; transform: translate(-50%, 0); }
                100% { opacity: 0; transform: translate(-50%, -20px); }
            }
        `;
                document.head.appendChild(style);

                document.getElementById('p-container').appendChild(notification);
                setTimeout(() => notification.remove(), 2000);
            },

            setupGestures() {
            },

            showNextEpisodePrompt(vidId) {
                const vidData = document.querySelector('[data-vid]');
                const seriesId = vidData?.dataset.series;
                const seasonId = vidData?.dataset.season;
                const currentEp = parseInt(vidData?.dataset.episode || '0');

                if (seriesId && seasonId && currentEp) {
                    fetch(`${API_BASE}/episodes?seriesId=${seriesId}&seasonId=${seasonId}`)
                        .then(r => r.json())
                        .then(eps => {
                            const nextEp = eps.find(e => e.episodeNumber === currentEp + 1);

                            if (nextEp) {
                                const card = document.createElement('div');
                                card.className = 'next-episode-card';
                                card.style.cssText = `
                            position: absolute;
                            bottom: 100px;
                            right: 30px;
                            background: rgba(0,0,0,0.9);
                            backdrop-filter: blur(20px);
                            border: 2px solid #1bd68e;
                            border-radius: 16px;
                            padding: 20px;
                            width: 350px;
                            z-index: 100;
                            animation: slideInLeft 0.5s ease;
                        `;

                                card.innerHTML = `
                            <div class="flex items-center gap-4 mb-4">
                                <i class="fa-solid fa-forward-step text-primary text-2xl"></i>
                                <span class="text-white font-black">التالي</span>
                            </div>
                            <div class="flex gap-4 mb-4">
                                <img src="${nextEp.thumbnail || nextEp.poster}" 
                                     class="w-24 h-16 object-cover rounded-lg">
                                <div class="flex-1">
                                    <div class="text-primary text-sm font-black">حلقة ${nextEp.episodeNumber}</div>
                                    <div class="text-white font-bold">${nextEp.title || 'الحلقة التالية'}</div>
                                </div>
                            </div>
                            <div class="flex gap-3">
                                <button onclick="Router.go('player', {id: '${nextEp.id}', type: 'episode'})" 
                                    class="flex-1 bg-primary text-black py-3 rounded-xl font-black hover:bg-white transition-all">
                                    تشغيل
                                </button>
                                <button onclick="this.closest('.next-episode-card').remove()" 
                                    class="flex-1 bg-white/10 text-white py-3 rounded-xl font-black hover:bg-white/20 transition-all">
                                    إلغاء
                                </button>
                            </div>
                            <div class="text-center text-gray-500 text-sm mt-3">
                                سيتم التشغيل بعد <span id="next-countdown">25</span> ثواني
                            </div>
                        `;

                                document.getElementById('p-container').appendChild(card);

                                let count = 25;
                                const timer = setInterval(() => {
                                    count--;
                                    const countEl = document.getElementById('next-countdown');
                                    if (countEl) countEl.textContent = count;

                                    if (count <= 0) {
                                        clearInterval(timer);
                                        Router.go('player', { id: nextEp.id, type: 'episode' });
                                    }
                                }, 1000);

                                const closeBtn = card.querySelector('button:last-child');
                                closeBtn.onclick = () => {
                                    clearInterval(timer);
                                    card.remove();
                                };
                            }
                        });
                }
            },

            like() {
                const vidId = document.querySelector('[data-vid]').dataset.vid;
                fetch(`${API_BASE}/like/${vidId}`, { method: 'POST' })
                    .then(() => {
                        const btn = event.currentTarget;
                        btn.innerHTML = '<i class="fa-solid fa-thumbs-up text-primary text-xl"></i>';
                        this.showNotification(' شكراً على تقييمك');
                    });
            },

            share() {
                if (navigator.share) {
                    navigator.share({
                        title: document.title,
                        url: window.location.href
                    }).then(() => {
                        this.showNotification(' تم المشاركة');
                    });
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    this.showNotification(' تم نسخ الرابط');
                }
            },

            addToWatchlist() {
