<html lang="ar" dir="rtl">

<head>

    <base href="/">

    <script src="/script.js"></script>

    <link rel="stylesheet" href="/fontawesome/fontawesome/css/all.min.css">

    <link href="/css/font.css" rel="stylesheet">

    <link href="/css/collection.css" rel="stylesheet">
    <link href="/css/history.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1bd68e',
                        accent: '#ff0f1a',
                        obsidian: '#050608',
                        surface: '#11131a',
                        card: '#1a1d26'
                    },
                    fontFamily: { sans: ['Readex Pro', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        :root {
            --p: #1bd68e;
            --bg: #050608;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
            overflow-x: hidden;
            font-family: 'Readex Pro', sans-serif;
        }

        .container-custom {
            max-width: 1440px;
            margin-left: auto;
            margin-right: auto;
        }

        @media (min-width: 768px) {
            #app-root {
                margin-right: 0;
                max-width: calc(100vw - 96px);
                overflow-x: hidden;
            }


        }

        .glass {
            background: rgba(17, 19, 26, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar-glass {
            background: rgba(11, 13, 20, 0.8);
            backdrop-filter: blur(25px);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-js.vjs-theme-ultra {
            font-family: 'Readex Pro', sans-serif;
            color: #fff;
            border-radius: 0;
        }

        .vjs-theme-ultra .vjs-big-play-button {
            background: rgba(27, 214, 142, 0.9) !important;
            border: none !important;
            border-radius: 50% !important;
            width: 80px !important;
            height: 80px !important;
            line-height: 80px !important;
            top: 50% !important;
            left: 50% !important;
            margin-top: -40px !important;
            margin-left: -40px !important;
            box-shadow: 0 0 40px rgba(27, 214, 142, 0.4);
            display: none !important;
        }

        .vjs-theme-ultra .vjs-play-progress {
            background-color: #1bd68e !important;
        }

        .vjs-theme-ultra .vjs-play-progress:before {
            color: #1bd68e !important;
        }

        .vjs-theme-ultra .vjs-load-progress {
            background: rgba(255, 255, 255, 0.2) !important;
        }

        .vjs-theme-ultra .vjs-slider {
            background-color: rgba(255, 255, 255, 0.1) !important;
        }

        .vjs-theme-ultra .vjs-control-bar {
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.5) 50%, transparent 100%) !important;
            height: 100px !important;
            align-items: flex-end !important;
            padding-bottom: 10px !important;
        }

        .netflix-center-controls {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 40px;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .ultra-player-container:hover .netflix-center-controls,
        .ultra-player-container.vjs-paused .netflix-center-controls {
            opacity: 1;
            pointer-events: all;
        }

        .netflix-center-controls.locked {
            display: none !important;
        }

        .center-btn {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .center-btn:hover {
            background: rgba(27, 214, 142, 0.8);
            transform: scale(1.1);
        }

        .center-btn.play-large {
            width: 90px;
            height: 90px;
            font-size: 40px;
        }

        .player-lock-btn {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            z-index: 110;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 28px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
        }

        .ultra-player-container:hover .player-lock-btn {
            opacity: 1;
        }

        .player-lock-btn.active {
            color: #1bd68e;
            opacity: 1;
            background: rgba(0, 0, 0, 0.8);
        }

        .player-top-bar.locked {
            display: none !important;
        }

        .player-bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.6) 50%, transparent 100%);
            padding: 20px 30px 30px 30px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(10px);
            pointer-events: none;
        }

        .ultra-player-container:hover .player-bottom-bar,
        .ultra-player-container.vjs-paused .player-bottom-bar {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .player-bottom-bar.locked {
            display: none !important;
        }

        .custom-progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            margin-bottom: 20px;
            transition: height 0.2s;
        }

        .custom-progress-container:hover {
            height: 10px;
        }

        .custom-progress-bar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--p);
            border-radius: 10px;
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 15px var(--p);
        }

        .custom-progress-handle {
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .custom-progress-container:hover .custom-progress-handle {
            transform: translateY(-50%) scale(1);
        }

        .bottom-ctrl-btn {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            border-radius: 12px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .bottom-ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--p);
            transform: translateY(-3px);
        }

        .bottom-ctrl-btn:active {
            scale: 0.9;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 45px;
            overflow: hidden;
            transition: width 0.3s;
        }

        .volume-container:hover {
            width: 150px;
        }

        .volume-slider {
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }

        .volume-fill {
            height: 100%;
            background: var(--p);
            border-radius: 10px;
            width: 100%;
        }

        .tap-region {
            position: absolute;
            top: 0;
            bottom: 100px;
            width: 30%;
            z-index: 50;
        }

        .tap-left {
            left: 0;
        }

        .tap-right {
            right: 0;
        }

        .page-fade {
            animation: pageFade 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pageFade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .card-glow:hover {
            box-shadow: 0 0 20px rgba(27, 214, 142, 0.2);
            border-color: rgba(27, 214, 142, 0.4);
        }

        .speed-overlay {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #1bd68e;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 800;
            border: 1px solid #1bd68e;
            z-index: 100;
            pointer-events: none;
            display: none;
            box-shadow: 0 0 20px rgba(27, 214, 142, 0.3);
        }

        #hero-slider-container {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform;
            height: 100%;
            touch-action: pan-y;
        }

        #hero-slider-container.dragging {
            transition: none !important;
        }

        .hero-mask {
            background: linear-gradient(to top, #050608 0%, rgba(5, 6, 8, 0.8) 40%, transparent 100%);
        }

        .side-mask {
            background: linear-gradient(to left, #050608 0%, rgba(5, 6, 8, 0.4) 50%, transparent 100%);
        }

        .slide {
            transition: opacity 0.5s ease;
        }

        .hero-dot {
            transition: all 0.4s ease;
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hero-dot.active {
            background-color: var(--p) !important;
            width: 2.5rem !important;
            border-color: var(--p) !important;
        }

        .slide-in-rtl {
            animation: slideInRTL 0.4s ease-out forwards;
        }

        @keyframes slideInRTL {
            from {
                opacity: 0;
                transform: translateX(30px);

            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }


        .seasons-wrapper {
            position: relative;
            display: inline-flex;
            flex-direction: row-reverse;
            background: rgba(255, 255, 255, 0.05);
            padding: 0;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            gap: 0;
            z-index: 1;
        }

        .season-indicator {
            position: absolute;
            top: 0;
            bottom: 0;
            background: var(--p);
            border-radius: 0;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 0;
            box-shadow: 0 4px 15px rgba(27, 214, 142, 0.3);
            opacity: 1 !important;
        }

        .season-btn {
            position: relative;
            z-index: 1;
            padding: 8px 20px 8px 8px;
            font-weight: 900;
            font-size: 0.875rem;
            transition: all 0.3s;
            border-radius: 0;
        }

        .active-season {
            color: black !important;
        }


        .active-tab {
            color: #1bd68e !important;
        }

        .active-tab .tab-line {
            width: 100% !important;
            opacity: 1;
        }

        .actor-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .actor-dot.active {
            background: #1bd68e;
            width: 18px;
            border-radius: 10px;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .ultra-player-container {
            position: relative;
            width: 100%;
            background: black;
            direction: ltr;
        }

        .ultra-player-container video {
            object-fit: contain !important;
            object-position: center !important;
            background: black;
        }

        .ultra-player-container .video-js {
            background-color: black !important;
        }

        .ultra-player-container .vjs-tech {
            object-fit: contain !important;
            object-position: center !important;
        }

        .ultra-poster {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .ultra-poster.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .ultra-big-play {
            width: 90px;
            height: 90px;
            background: rgba(27, 214, 142, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 30px rgba(27, 214, 142, 0.5);
        }

        .ultra-big-play i {
            font-size: 40px;
            color: black;
            margin-left: 5px;
        }

        .ultra-big-play:hover {
            transform: scale(1.1);
            background: #fff;
        }

        .ultra-big-play:hover i {
            color: #1bd68e;
        }

        .ultra-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 20px 20px 15px;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .ultra-player-container.show-controls .ultra-controls,
        .ultra-player-container:hover .ultra-controls {
            opacity: 1;
            pointer-events: all;
        }

        .ultra-progress-container {
            width: 100%;
            margin-bottom: 15px;
            cursor: pointer;
            position: relative;
            height: 5px;
        }

        .ultra-progress-bg {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .ultra-progress-fill {
            height: 100%;
            background: #1bd68e;
            border-radius: 10px;
            position: relative;
            width: 0%;
            transition: width 0.1s linear;
        }

        .ultra-progress-buffered {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            width: 0%;
        }

        .ultra-progress-handle {
            width: 13px;
            height: 13px;
            background: #1bd68e;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            left: 0;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 0 10px rgba(27, 214, 142, 0.5);
        }

        .ultra-progress-container:hover .ultra-progress-handle {
            opacity: 1;
        }

        .ultra-controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-direction: row-reverse;
            color: white;
        }

        .ultra-controls-group {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-direction: row-reverse;
        }

        .ultra-control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .ultra-control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #1bd68e;
        }

        .ultra-control-btn:active {
            transform: scale(0.9);
        }

        .ultra-control-btn.active {
            color: #1bd68e;
        }

        .ultra-time {
            font-size: 14px;
            font-weight: bold;
            color: white;
            margin: 0 5px;
            direction: ltr;
            font-family: monospace;
        }

        .ultra-volume-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .ultra-volume-slider {
            width: 0;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-right: 10px;
            overflow: hidden;
            transition: width 0.2s;
        }

        .ultra-volume-container:hover .ultra-volume-slider {
            width: 80px;
        }

        .ultra-volume-fill {
            height: 100%;
            background: #1bd68e;
            width: 100%;
        }

        .ultra-volume-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .ultra-speed-menu {
            position: absolute;
            bottom: 50px;
            left: 0;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            display: none;
            z-index: 30;
        }

        .ultra-speed-menu.show {
            display: block;
        }

        .ultra-speed-item {
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .ultra-speed-item:hover {
            background: rgba(27, 214, 142, 0.2);
            color: #1bd68e;
        }

        .ultra-speed-item.active {
            background: #1bd68e;
            color: black;
            font-weight: bold;
        }

        .ultra-focus-indicator {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 3px solid #1bd68e;
            border-radius: 4px;
            pointer-events: none;
            z-index: 25;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 0 20px rgba(27, 214, 142, 0.3);
        }

        .ultra-player-container.focused .ultra-focus-indicator {
            opacity: 1;
        }

        .ultra-notification {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            border: 2px solid #1bd68e;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            display: none;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
        }

        .ultra-notification.show {
            display: flex;
        }

        .ultra-quality-menu {
            position: absolute;
            bottom: 50px;
            right: 0;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            display: none;
            z-index: 30;
            min-width: 150px;
        }

        .ultra-quality-menu.show {
            display: block;
        }

        .ultra-quality-item {
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .ultra-quality-item:hover {
            background: rgba(27, 214, 142, 0.2);
            color: #1bd68e;
        }

        .ultra-quality-item.active {
            background: #1bd68e;
            color: black;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .ultra-big-play {
                width: 70px;
                height: 70px;
            }

            .ultra-big-play i {
                font-size: 30px;
            }

            .ultra-control-btn {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }

            .ultra-volume-container:hover .ultra-volume-slider {
                width: 50px;
            }
        }

        .vjs-text-track-display {
            bottom: 120px !important;
            font-size: 24px !important;
            font-family: 'Readex Pro', sans-serif !important;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 1) !important;
        }

        @media (max-width: 768px) {
            .vjs-text-track-display {
                font-size: 18px !important;
                bottom: 100px !important;
            }
        }

        .custom-menu {
            position: absolute;
            bottom: 85px;
            right: 30px;
            background: rgba(11, 13, 20, 0.95);
            backdrop-filter: blur(30px);
            border-radius: 20px;
            padding: 12px;
            z-index: 200;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            min-width: 200px;
            animation: menuShow 0.3s cubic-bezier(0.18, 1, 0.32, 1);
        }

        @keyframes menuShow {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .menu-item {
            padding: 12px 20px;
            color: white;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14px;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--p);
        }

        .menu-item.active {
            background: var(--p);
            color: black;

                    class="flex items-center gap-4 pb-6 border-b border-white/5 cursor-pointer hover:opacity-80 transition-opacity">
                    <img src="/assets/default.png"
                        class="user-avatar-display w-16 h-16 rounded-full border-2 border-primary object-cover">
                    <div>
                        <h4 class="user-name-display font-black text-white">الضيف</h4>
                        <p class="text-gray-500 text-sm">مشترك مميز</p>
                    </div>
                </div>

                <button onclick="Router.go('watchlist')"
                    class="flex items-center gap-4 text-gray-400 hover:text-primary transition-colors text-right">
                    <i class="fa-regular fa-bookmark w-6"></i>
                    <span class="font-bold">قائمتي</span>
                </button>
                <button onclick="Router.go('social'); toggleMobileDrawer()"
                    class="heddin flex items-center gap-4 text-gray-400 hover:text-primary transition-colors text-right">
                    <i class="fa-solid fa-comments w-6"></i>
                    <span class="font-bold">التواصل الاجتماعي</span>
                </button>
                <button onclick="Router.go('later')"
                    class="flex items-center gap-4 text-gray-400 hover:text-primary transition-colors text-right">
                    <i class="fa-regular fa-clock w-6"></i>
                    <span class="font-bold">مشاهدة لاحقاً</span>
                </button>
                <button onclick="Router.go('account')"
                    class="flex items-center gap-4 text-gray-400 hover:text-primary transition-colors text-right">
                    <i class="fa-solid fa-user-gear w-6"></i>
                    <span class="font-bold">حسابي</span>
                </button>
                <button onclick="Router.go('settings')"
                    class="flex items-center gap-4 text-gray-400 hover:text-primary transition-colors text-right">
                    <i class="fa-solid fa-gear w-6"></i>
                    <span class="font-bold">الإعدادات</span>
                </button>
                <button onclick="Router.go('help')"
                    class="flex items-center gap-4 text-gray-400 hover:text-primary transition-colors text-right">
                    <i class="fa-regular fa-circle-question w-6"></i>
                    <span class="font-bold">مساعدة</span>
                </button>
                <button onclick="logout()"
                    class="flex items-center gap-4 text-red-500 hover:text-red-400 transition-colors text-right mt-10 pt-6 border-t border-white/5">
                    <i class="fa-solid fa-arrow-right-from-bracket w-6"></i>
                    <span class="font-bold">تسجيل الخروج</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        window.handleProfileLogin = async function (e) {
            e.preventDefault();
            console.log('[DEBUG] Handling secure credentials login submission');
            const usernameInput = document.getElementById('profile-username');
            const passwordInput = document.getElementById('profile-password');
            const errorDiv = document.getElementById('profile-login-error');

            const username = usernameInput ? usernameInput.value : '';
            const password = passwordInput ? passwordInput.value : '';

            if (!username || !password) {
                errorDiv.textContent = 'يرجى إدخال اسم المستخدم وكلمة المرور';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const loginRes = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const loginData = await loginRes.json();

                if (loginData.success) {
                    const sessionData = {
                        userId: loginData.user.id,
                        username: loginData.user.username,
                        name: loginData.user.name || loginData.user.username,
                        avatar: loginData.user.avatar || '/uploads/users/default.png',
                        age: loginData.user.age || 0,
                        profileId: loginData.profiles && loginData.profiles[0] ? loginData.profiles[0].id : loginData.user.id
                    };
                    localStorage.setItem('session', JSON.stringify(sessionData));
                    window.location.reload();
                } else {
                    errorDiv.textContent = loginData.error || 'اسم المستخدم أو كلمة المرور غير صحيحة';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                console.error('[ERROR] Secure login failed:', err);
                errorDiv.textContent = 'حدث خطأ في الاتصال';
                errorDiv.classList.remove('hidden');
            }
        };

        const API_BASE = '/api';
        let currentSession = null;

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errDiv = document.getElementById('login-error');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    saveSession({
                        userId: data.user.id,
                        username: data.user.username,
                        name: data.user.name,
                        age: data.user.age,
                        profileId: data.user.id
                    });
                    document.getElementById('login-modal').style.display = 'none';
                    Router.go('home');
                    if (typeof Views !== 'undefined' && Views.bootstrapSocial) {
                        Views.bootstrapSocial();
                    }
                } else {
                    errDiv.innerText = data.error || 'فشل تسجيل الدخول';
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.innerText = 'حدث خطأ في الاتصال';
                errDiv.classList.remove('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!loadSession()) {
                Router.go('profileSelection', {}, false);
            } else {
                Router.resolve();
                if (typeof Views !== 'undefined' && Views.bootstrapSocial) {
                    Views.bootstrapSocial();
                }
            }
        });

        window.onpopstate = (e) => {
            if (e.state) {
                Router.go(e.state.view, e.state.params, false);
            } else {
                Router.resolve();
            }
        };

        const originalFetch = window.fetch;
        window.fetch = function () {
            let [resource, config] = arguments;
            const isApi = typeof resource === 'string' && resource.startsWith(API_BASE);
            const isAuth = typeof resource === 'string' && resource.includes('/auth/');

            if (isApi && !isAuth && currentSession && currentSession.userId) {
                const separator = resource.includes('?') ? '&' : '?';
                let query = 'userId=' + currentSession.userId;
                if (currentSession.profileId) {
                    query += '&profileId=' + currentSession.profileId;
                }
                resource += separator + query;
            }
            return originalFetch(resource, config);
        };

        async function logWatchHistory(contentId, contentType, progress) {
            if (!currentSession || !currentSession.userId) return;
            try {
                await fetch('/api/history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentSession.userId,
                        contentId: contentId,
                        contentType: contentType,
                        progress: progress
                    })
                });
            } catch (err) {
                console.error('Failed to log history', err);
            }
        }

        const State = { view: 'home', params: {}, player: null };


        function saveSession(session) {
            currentSession = session;
            localStorage.setItem('session', JSON.stringify(session));
        }

        function clearSession() {
            currentSession = null;
            localStorage.removeItem('session');
        }


        function loadSession() {
            const saved = localStorage.getItem('session');
            if (saved) {
                try {
                    currentSession = JSON.parse(saved);
                    if (currentSession && currentSession.userId) {
                        return true;
                    }
                } catch (e) { }
            }
            currentSession = null;
            return false;
        }

        function showAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `fixed top-20 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-xl font-bold shadow-lg transition-all duration-300 ${type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`;
            alertDiv.innerHTML = message;
            document.body.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 3000);
        }

        function logout() {
            clearSession();
            if (window.socket) {
                window.socket.disconnect();
                window.socket = null;
            }
            const bubble = document.getElementById('floating-chat-bdubble');
            if (bubble) bubble.classList.add('hidden');
            const drawer = document.getElementById('floating-chat-drawer');
            if (drawer) drawer.classList.remove('open');
            Router.go('profileSelection');
        }

        const UserActions = {
            async toggleLike(contentId, contentType, btnId, iconId, isPlayer = false) {
                const s = currentSession || {};
                if (!s.userId) {
                    if (isPlayer) PlayerEngine.showNotification('يرجى تسجيل الدخول أولاً');
                    else showAlert('يرجى تسجيل الدخول أولاً', 'error');
                    return;
                }

                try {
                    const res = await fetch(`${API_BASE}/user/like`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: s.userId, contentId, contentType })
                    });
                    const data = await res.json();
                    this.updateUI(btnId, iconId, data.isLiked, 'like');
                    const msg = data.isLiked ? ' تمت الإضافة للإعجابات' : 'تمت الإزالة من الإعجابات';
                    if (isPlayer) PlayerEngine.showNotification(msg);
                    else showAlert(msg);
                    this.refreshLibrary();
                } catch (e) { console.error(e); }
            },
            async toggleSave(contentId, contentType, btnId, iconId, isPlayer = false) {
                const s = currentSession || {};
                if (!s.userId) {
                    if (isPlayer) PlayerEngine.showNotification('يرجى تسجيل الدخول أولاً');
                    else showAlert('يرجى تسجيل الدخول أولاً', 'error');
                    return;
                }

                try {
                    const res = await fetch(`${API_BASE}/user/save`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: s.userId, contentId, contentType })
                    });
                    const data = await res.json();
                    this.updateUI(btnId, iconId, data.isSaved, 'save');
                    const msg = data.isSaved ? ' تم الحفظ في مكتبتك' : 'تمت الإزالة من المكتبة';
                    if (isPlayer) PlayerEngine.showNotification(msg);
                    else showAlert(msg);
                    this.refreshLibrary();
                } catch (e) { console.error(e); }
            },
            updateUI(btnId, iconId, isActive, type) {
                const btn = document.getElementById(btnId);
                const icon = document.getElementById(iconId);
                if (!btn || !icon) return;

                if (isActive) {
                    btn.classList.add('bg-white', 'text-black');
                    btn.classList.remove('bg-white/5', 'text-white');
                    if (icon.classList.contains('fa-regular')) icon.classList.replace('fa-regular', 'fa-solid');
                } else {
                    btn.classList.remove('bg-white', 'text-black');
                    btn.classList.add('bg-white/5', 'text-white');
                    if (icon.classList.contains('fa-solid')) icon.classList.replace('fa-solid', 'fa-regular');
                }
            },
            async refreshLibrary() {
                if (currentSession && currentSession.userId) {
                    try {
                        const libRes = await fetch(`${API_BASE}/user/library/${currentSession.userId}`);
                        window.userLibrary = await libRes.json();
                    } catch (e) { }
                }
            },
            isLiked(id) { return window.userLibrary?.likes?.some(l => l.contentId === id); },
            isSaved(id) { return window.userLibrary?.watchlist?.some(w => w.contentId === id); }
        };

        const Router = {
            async go(view, params = {}, push = true) {
                if (State.view === 'player' && typeof PlayerEngine !== 'undefined' && PlayerEngine.player) {
                    PlayerEngine.saveProgressSync();
                }

                if (!currentSession && view !== 'profileSelection' && view !== 'login') {
                    view = 'profileSelection';
                    params = {};
                }

                State.view = view;
                State.params = params;

                if (push) {
                    let path = '/';
                    if (view === 'movies') path = '/movies';
                    else if (view === 'series') path = '/series';
                    else if (view === 'search') path = '/search';
                    else if (view === 'details') path = `/details/${params.id}`;
                    else if (view === 'collection') path = `/collection/${params.id}`;
                    else if (view === 'actor') path = `/actor/${params.id}`;
                    else if (view === 'player') path = `/player/${params.id}/${params.type}`;
                    else if (view === 'social') path = '/social';
                    else if (view === 'account') path = '/account';
                    else if (view === 'history') path = '/history';
                    else if (view === 'watchlist') path = '/watchlist';
                    else if (view === 'continueWatching') path = '/continue-watching';
                    else if (view === 'collections') path = '/collections';

                    history.pushState({ view, params }, '', path);
                }

                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.updateActiveNav();
                await this.render();
            },

            async resolve() {
                const path = window.location.pathname;
                let view = '';
                let params = {};

                if (path === '/' || path === '') view = 'home';
                else if (path === '/movies') view = 'movies';
                else if (path === '/series') view = 'series';
                else if (path === '/search') view = 'search';
                else if (path === '/social') view = 'social';
                else if (path === '/account') view = 'account';
                else if (path === '/history') view = 'history';
                else if (path === '/watchlist') view = 'watchlist';
                else if (path === '/continue-watching') view = 'continueWatching';
                else if (path === '/collections') view = 'collections';
                else if (path.startsWith('/details/')) {
                    view = 'details';
                    params.id = path.split('/')[2];
                }
                else if (path.startsWith('/collection/')) {
                    view = 'collection';
                    params.id = path.split('/')[2];
                }
                else if (path.startsWith('/actor/')) {
                    view = 'actor';
                    params.id = path.split('/')[2];
                }
                else if (path.startsWith('/player/')) {
                    view = 'player';
                    const parts = path.split('/');
                    params.id = parts[2];
                    params.type = parts[3];
                }

                if (view) {
                    await this.go(view, params, false);
                } else {
                    window.location.href = '/404.html';
                }
            },

            updateActiveNav() {
                document.querySelectorAll('.nav-link').forEach(el => {
                    el.classList.toggle('active', el.dataset.view === State.view);
                });
                document.querySelectorAll('.mobile-nav-link').forEach(el => {
                    const isActive = el.dataset.view === State.view;
                    el.classList.toggle('text-primary', isActive);
                    el.classList.toggle('text-gray-500', !isActive);
                    el.classList.toggle('active', isActive);
                });
            },
            async render() {
                const root = document.getElementById('app-root');
                root.innerHTML = `<div class="h-screen flex items-center justify-center"><div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin"></div></div>`;

                if (currentSession && currentSession.userId && State.view !== 'player') {
                    try {
                        const libRes = await fetch(`${API_BASE}/user/library/${currentSession.userId}`);
                        window.userLibrary = await libRes.json();
                    } catch (e) { console.error('Failed to load library data for progress', e); }
                }

                try {
                    let html = '';
                    switch (State.view) {
                        case 'home':
                            document.querySelector('aside')?.classList.remove('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            html = await Views.home();
                            break;
                        case 'profileSelection':
                            document.querySelector('aside')?.classList.add('hidden');
                            document.querySelector('nav')?.classList.add('hidden');
                            html = await Views.profileSelection();
                            break;
                        case 'details':
                            document.querySelector('aside')?.classList.remove('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            html = await Views.details(State.params.id);
                            root.innerHTML = `<div class="page-fade">${html}</div>`;
                            Views.initSeasonMarker();
                            return;
                        case 'actor':
                            document.querySelector('aside')?.classList.remove('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            html = await Views.actor(State.params.id);
                            break;
                        case 'player':
                            document.querySelector('aside')?.classList.add('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            html = await Views.player(State.params.id, State.params.type);
                            break;
                        case 'search':
                            document.querySelector('aside')?.classList.remove('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            html = Views.search();
                            break;
                        case 'movies':
                            document.querySelector('aside')?.classList.remove('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            html = await Views.grid('movies');
                            break;
                        case 'series':
                            document.querySelector('aside')?.classList.remove('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            html = await Views.grid('series');
                            break;
                        case 'collection':
                            document.querySelector('aside')?.classList.remove('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            await Views.collection(State.params);
                            return;
                        case 'account':
                            document.querySelector('aside')?.classList.remove('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            html = await Views.account();
                            break;
                        case 'history':
                            document.querySelector('aside')?.classList.remove('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            html = await Views.history();
                            break;
                        case 'watchlist':
                            document.querySelector('aside')?.classList.remove('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            html = await Views.watchlist();
                            break;
                        case 'continueWatching':
                            document.querySelector('aside')?.classList.remove('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            html = await Views.continueWatching();
                            break;
                        case 'collections':
                            document.querySelector('aside')?.classList.remove('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            html = await Views.collections();
                            break;
                        case 'social':
                            document.querySelector('aside')?.classList.remove('hidden');
                            document.querySelector('nav')?.classList.remove('hidden');
                            html = await Views.social();
                            root.innerHTML = `<div class="page-fade">${html}</div>`;
                            Views.initSocial();
                            return;
                    }
                    root.innerHTML = `<div class="page-fade">${html}</div>`;
                    if (State.view === 'player') PlayerEngine.init();

                    if (currentSession) {
                        document.querySelectorAll('.user-name-display').forEach(el => el.innerText = currentSession.name);
                        document.querySelectorAll('.user-avatar-display').forEach(el => el.src = currentSession.avatar || '/uploads/users/default.png');
                    }
                } catch (e) {
                    console.error(e);
                    root.innerHTML = `<div class="h-screen flex flex-col items-center justify-center text-center px-6"><h2 class="text-2xl font-bold mb-4 text-red-500">حدث خطأ</h2><button onclick="Router.go('home')" class="bg-primary text-black px-8 py-3 rounded-xl font-bold">العودة للرئيسية</button></div>`;
                }
            }
        };

        const UI = {
            card(item) {
                if (!item) return '';
                let prog = item.progress || 0;
                if (window.userLibrary && window.userLibrary.history) {
                    const hItem = window.userLibrary.history.find(h => h.contentId === item.id);
                    if (hItem && hItem.progress > 0) prog = hItem.progress;
                }
                const liked = UserActions.isLiked(item.id);
                const saved = UserActions.isSaved(item.id);

                return `
                    <div class="group cursor-pointer relative">
                        <div onclick="Router.go('details', {id: '${item.id}'})" class="relative aspect-[2/3] rounded-2xl overflow-hidden bg-surface border border-white/5 transition-all duration-500 card-glow group-hover:-translate-y-2">
                            <img src="${item.poster || '/assets/default-poster.png'}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" loading="lazy">
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none">
                                <div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center text-black shadow-xl scale-50 group-hover:scale-100 transition-all pointer-events-auto">
                                    <i class="fa-solid fa-play ml-1"></i>
                                </div>
                            </div>
                            
                            <!-- Quick Actions Overlay -->
                            <div class="absolute top-2 right-2 flex flex-col gap-2 opacity-0 group-hover:opacity-100 transition-all duration-300 translate-x-10 group-hover:translate-x-0">
                                <button id="card-like-${item.id}" onclick="event.stopPropagation(); UserActions.toggleLike('${item.id}', '${item.isMovie ? 'movie' : 'series'}', 'card-like-${item.id}', 'card-like-icon-${item.id}')" 
                                    class="w-8 h-8 rounded-lg backdrop-blur-md border border-white/10 flex items-center justify-center ${liked ? 'bg-primary text-black' : 'bg-black/60 text-white'} hover:scale-110 active:scale-90 transition-all">
                                    <i id="card-like-icon-${item.id}" class="${liked ? 'fa-solid' : 'fa-regular'} fa-heart text-xs"></i>
                                </button>
                                <button id="card-save-${item.id}" onclick="event.stopPropagation(); UserActions.toggleSave('${item.id}', '${item.isMovie ? 'movie' : 'series'}', 'card-save-${item.id}', 'card-save-icon-${item.id}')" 
                                    class="w-8 h-8 rounded-lg backdrop-blur-md border border-white/10 flex items-center justify-center ${saved ? 'bg-primary text-black' : 'bg-black/60 text-white'} hover:scale-110 active:scale-90 transition-all">
                                    <i id="card-save-icon-${item.id}" class="${saved ? 'fa-solid' : 'fa-regular'} fa-bookmark text-xs"></i>
                                </button>
                            </div>

                            <div class="absolute top-2 left-2 bg-black/60 backdrop-blur px-2 py-0.5 rounded text-[10px] font-black border border-white/10 pointer-events-none">
                                <i class="fa-solid fa-star text-yellow-500 mr-1"></i>${parseFloat(item.rating || 0).toFixed(1)}
                            </div>
                            ${item.tags ? `
                            <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur px-2 py-0.5 rounded text-[10px] font-black border border-white/10 text-orange-400 pointer-events-none">
                                <span>${item.tags}</span>
                            </div>` : ''}
                            ${prog > 0 ? `<div class="thumb-progress"><div class="thumb-progress-fill" style="width: ${prog}%"></div></div>` : ''}
                        </div>
                        <h3 class="mt-3 text-xs md:text-sm font-bold truncate group-hover:text-primary transition-colors text-right px-1" onclick="Router.go('details', {id: '${item.id}'})">${item.displayTitle || item.title || 'عنوان غير معروف'}</h3>
                        <div class="flex justify-between items-center px-1 mt-1 text-[10px] text-gray-500 font-bold opacity-60">
                            <span>${item.year || ''}</span>
                            <span>${item.isMovie ? 'فيلم' : 'مسلسل'}</span>
                        </div>
                    </div>
                `;
            },
            collectionCard(col) {
                if (!col || !col.items || col.items.length === 0) return '';
                const posters = col.items.map(i => i.poster).filter(Boolean);
                if (posters.length === 0) posters.push('/assets/default-poster.png');

                return `
                    <div onclick="Router.go('collection', {id: '${col.id}'})" class="group cursor-pointer collection-card" data-posters='${JSON.stringify(posters)}'>
                        <div class="relative aspect-[2/3] rounded-2xl overflow-hidden bg-surface border border-white/5 transition-all duration-500 card-glow group-hover:-translate-y-2">
                            
                            <!-- Slideshow Container -->
                            <div class="collection-slideshow h-full w-full relative">
                                <img src="${posters[0]}" class="slideshow-img w-full h-full object-cover transition-opacity duration-700">
                                <img src="${posters[1] || posters[0]}" class="slideshow-img absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-700">
                            </div>

                            <div class="absolute top-2 right-2 bg-black/60 backdrop-blur px-2 py-0.5 rounded text-[10px] font-black border border-white/10 flex items-center gap-1">
                                <i class="fas fa-layer-group text-primary"></i>
                                <span>${col.items.length} أجزاء</span>
                            </div>
                            <div class="absolute top-2 left-2 bg-primary/20 backdrop-blur px-2 py-0.5 rounded text-[10px] font-black border border-primary/20 text-primary">
                                <span>مجموعة</span>
                            </div>
                        </div>

                                                class="bg-primary text-black px-8 lg:px-10 py-3 lg:py-4 rounded-xl lg:rounded-2xl font-black text-sm lg:text-base hover:bg-white hover:scale-95 transition-all shadow-xl shadow-primary/30 flex items-center gap-2 lg:gap-3 active:scale-90">

                                    <h2 class="text-3xl font-black flex flex-row-reverse items-center gap-4"> أفلام ومجموعات <span class="w-1.5 h-8 bg-primary rounded-full shadow-[0_0_15px_#1bd68e]"></span></h2>

            },

            initHeroSlider(count) {
                if (count <= 1) return;
                this.slideCount = count;
                this.currentSlide = 0;
                const container = document.getElementById('hero-slider-container');
                if (!container) return;

                container.addEventListener('touchstart', (e) => {
                    this.isDragging = true;
                    this.startX = e.touches[0].clientX;
                    container.classList.add('dragging');
                    clearInterval(this.sliderInterval);
                }, { passive: true });

                container.addEventListener('touchmove', (e) => {
                    if (!this.isDragging) return;
                    const currentX = e.touches[0].clientX;
                    const diff = currentX - this.startX;
                    const move = (this.currentSlide * 100) - (diff / window.innerWidth * 100);
                    container.style.transform = `translateX(${move}%)`;
                }, { passive: true });

                container.addEventListener('touchend', (e) => {
                    this.isDragging = false;
                    container.classList.remove('dragging');
                    const endX = e.changedTouches[0].clientX;
                    const diff = this.startX - endX;

                    if (Math.abs(diff) > window.innerWidth * 0.15) {
                        if (diff > 0) this.currentSlide = (this.currentSlide + 1) % this.slideCount;
                        else this.currentSlide = (this.currentSlide - 1 + this.slideCount) % this.slideCount;
                    }
                    this.moveSlider(this.currentSlide);
                    this.startAutoPlay();
                });

                this.startAutoPlay();
                this.updateDots(0);
            },

            initCollectionSlideshow() {
                const cards = document.querySelectorAll('.collection-card');
                cards.forEach(card => {
                    const posters = JSON.parse(card.dataset.posters || '[]');
                    if (posters.length <= 1) return;

                    const imgs = card.querySelectorAll('.slideshow-img');
                    let currentIdx = 0;
                    let interval = null;

                    card.addEventListener('mouseenter', () => {
                        interval = setInterval(() => {
                            const nextIdx = (currentIdx + 1) % posters.length;

                            imgs[1].src = posters[nextIdx];
                            imgs[1].classList.remove('opacity-0');
                            imgs[0].classList.add('opacity-0');

                            setTimeout(() => {
                                imgs[0].src = posters[nextIdx];
                                imgs[0].classList.remove('opacity-0');
                                imgs[1].classList.add('opacity-0');
                                currentIdx = nextIdx;
                            }, 700);
                        }, 2500);
                    });

                    card.addEventListener('mouseleave', () => {
                        if (interval) clearInterval(interval);
                        imgs[0].src = posters[0];
                        imgs[0].classList.remove('opacity-0');
                        imgs[1].classList.add('opacity-0');
                        currentIdx = 0;
                    });
                });
            },

            startAutoPlay() {
                if (this.sliderInterval) clearInterval(this.sliderInterval);
                this.sliderInterval = setInterval(() => {
                    this.currentSlide = (this.currentSlide + 1) % this.slideCount;
                    this.moveSlider(this.currentSlide);
                }, 7000); // كل 7 ثواني
            },

            moveSlider(index) {
                const container = document.getElementById('hero-slider-container');
                if (container) {
                    container.style.transform = `translateX(${index * 100}%)`;
                    this.updateDots(index);
                }
            },

            jumpToSlide(index) {
                this.currentSlide = index;
                this.moveSlider(index);
                this.startAutoPlay();
            },

            updateDots(index) {
                const dots = document.querySelectorAll('.hero-dot');

                dots.forEach((dot) => {
                    dot.classList.remove('active');
                    void dot.offsetWidth;
                });

                if (dots[index]) {
                    dots[index].classList.add('active');
                }
            },

            async details(id) {
                const userId = localStorage.getItem('userId');
                const [item, cast, userState] = await Promise.all([
                    fetch(`${API_BASE}/series/${id}`).then(r => r.json()),
                    fetch(`${API_BASE}/content/${id}/actors`).then(r => r.json()),
                    fetch(`${API_BASE}/user/state/${id}?userId=${userId}`).then(r => r.json()).catch(() => ({ progress: 0, isLiked: false, isSaved: false }))
                ]);

                if (item.error) {
                    return Views.accessDenied(item.error);
                }

                let targetPlayId = !item.isMovie && item.seasons?.length > 0
                    ? (item.episodes?.find(e => e.seasonId === item.seasons[0].id)?.id || '')
                    : (item.isMovie ? item.id : (item.episodes?.[0]?.id || ''));
                let targetType = item.isMovie ? 'movie' : 'episode';

                if (!item.isMovie && userState.episodeId) {
                    targetPlayId = userState.episodeId;
                }

                let progress = userState.progress || 0;

                if (window.userLibrary && window.userLibrary.history) {
                    if (item.isMovie) {
                        const h = window.userLibrary.history.find(x => x.contentId === item.id);
                        if (h && h.progress > 0) progress = h.progress;
                    } else if (item.episodes) {
                        const watchedEps = window.userLibrary.history.filter(h => h.contentType === 'episode' && h.contentId === item.id);
                        for (let h of watchedEps) {
                            const ep = item.episodes.find(e => e.id === h.episodeId || e.id === h.id);
                            if (ep) {
                                targetPlayId = ep.id;
                                progress = h.progress;
                                break;
                            }
                        }
                    }
                }

                if (progress >= 95) progress = 0;
                const buttonText = progress > 0 ? 'أكمل المشاهدة' : 'شاهد الآن';

                            <div class="flex-1 flex items-center justify-between px-6 flex-row-reverse">
                                <div class="smart flex items-center gap-4 flex-row-reverse pr-20 md:pr-0">
                                    <img src="${item.poster || '/assets/default-poster.png'}" class="w-10 h-14 object-cover rounded shadow-lg border border-white/10">
                                    <div class="text-right">
                                        <h2 class="text-white font-black text-sm truncate max-w-[150px]">${item.title}</h2>

                        <div class="relative min-h-[70vh] lg:min-h-[85vh] w-full flex items-center overflow-hidden pt-20" style="max-width: 100%;">

                                        <span class="px-4 py-1.5 bg-white/10 text-white border border-white/10 text-[11px] font-black rounded-lg backdrop-blur-md">${item.year}</span>
                                        <span class="px-4 py-1.5 bg-white/10 text-primary border border-white/10 text-[11px] font-black rounded-lg backdrop-blur-md italic">★ ${parseFloat(item.rating).toFixed(1)}</span>

                                    ${item.collectionInfo ? `
