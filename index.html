                                                </div>
                                            </div>
                                        </div>
                                    ` : ''}

                                    <h1 class="text-4xl md:text-6xl lg:text-8xl font-black mb-10 text-white drop-shadow-2xl leading-none tracking-tighter">${item.title}</h1>
                                    <p class="text-gray-400 text-base lg:text-xl leading-relaxed mb-12 max-w-3xl opacity-80 lg:line-clamp-4">${item.description || 'لا يوجد وصف متاح لهذا العمل.'}</p>
                                    <div class="flex flex-col sm:flex-row-reverse items-center gap-6 w-full lg:w-auto">
                                        <button onclick="Router.go('player', {id: '${targetPlayId}', type: '${targetType}'})" 
                                            class="w-full sm:w-auto min-w-[240px] relative overflow-hidden bg-primary text-black px-12 py-5 rounded-3xl font-black text-xl hover:bg-white hover:scale-105 transition-all shadow-[0_20px_40px_rgba(27,214,142,0.3)] flex items-center justify-center gap-4 group">
                                            <i class="fa-solid ${progress > 0 ? 'fa-play-circle' : 'fa-play'} group-hover:scale-125 transition-transform"></i>
                                            <span>${buttonText}</span>
                                            ${progress > 0 ? `<div class="absolute bottom-0 left-0 h-1.5 bg-black/20 w-full"><div class="h-full bg-white shadow-[0_0_10px_white]" style="width: ${progress}%"></div></div>` : ''}
                                        </button>
                                        <div class="flex gap-4">
                                            <button id="det-like-${item.id}" onclick="UserActions.toggleLike('${item.id}', '${item.isMovie ? 'movie' : 'series'}', 'det-like-${item.id}', 'det-like-icon-${item.id}')"
                                                class="w-16 h-16 rounded-2xl ${UserActions.isLiked(item.id) ? 'bg-white text-black' : 'bg-white/5 text-white'} backdrop-blur-xl border border-white/10 flex items-center justify-center hover:bg-white hover:text-black transition-all group active:scale-90">
                                                <i id="det-like-icon-${item.id}" class="${UserActions.isLiked(item.id) ? 'fa-solid' : 'fa-regular'} fa-heart text-2xl group-hover:scale-110"></i>
                                            </button>
                                            <button id="det-save-${item.id}" onclick="UserActions.toggleSave('${item.id}', '${item.isMovie ? 'movie' : 'series'}', 'det-save-${item.id}', 'det-save-icon-${item.id}')"
                                                class="w-16 h-16 rounded-2xl ${UserActions.isSaved(item.id) ? 'bg-white text-black' : 'bg-white/5 text-white'} backdrop-blur-xl border border-white/10 flex items-center justify-center hover:bg-white hover:text-black transition-all group active:scale-90">
                                                <i id="det-save-icon-${item.id}" class="${UserActions.isSaved(item.id) ? 'fa-solid' : 'fa-regular'} fa-bookmark text-2xl group-hover:scale-110"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="max-w-7xl mx-auto px-6 md:px-10 mt-16 relative z-30">
                            <div class="flex flex-col lg:flex-row-reverse gap-16">
                                <div class="flex-1 text-right min-w-0">
                                    <div class="mb-20">
                                        <h3 class="text-xl font-black text-white mb-8 pr-4 border-r-4 border-primary">طاقم العمل</h3>
                                        <div class="flex flex-row-reverse gap-6 overflow-x-auto no-scrollbar pb-4">
                                            ${(cast || []).map(a => `
                                                <div onclick="Router.go('actor', {id: '${a.actorId}'})" class="flex flex-col items-center min-w-[100px] group cursor-pointer">
                                                    <div class="w-24 h-24 rounded-full p-[3px] border-2 border-primary/20 group-hover:border-primary transition-all duration-500 mb-4 overflow-hidden shadow-2xl">
                                                        <img src="${a.actorImage || a.image || '/uploads/actors/default.jpg'}" class="w-full h-full object-cover rounded-full group-hover:scale-110">
                                                    </div>
                                                    <div class="text-white font-black text-[12px] truncate w-28 text-center">${a.characterName || 'شخصية'}</div>
                                                    <div class="text-gray-500 text-[10px] font-bold truncate w-28 text-center opacity-60 italic">${a.actorName || a.name}</div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                    ${!item.isMovie ? `
                                        <div class="space-y-8 w-full">
                                            <div id="seasons-nav-original" class="flex flex-col md:flex-row-reverse items-center justify-between gap-6 pb-6 border-b border-white/5 w-full">
                                                <h3 class="text-2xl font-black text-white italic">قائمة الحلقات</h3>
                                                ${item.seasons?.length > 0 ? `
                                                <div class="flex flex-row-reverse flex-wrap justify-center gap-2 p-2 bg-white/5 rounded-full border border-white/5 relative" id="seasons-nav">
                                                    <div class="absolute bg-primary rounded-full transition-all duration-200 z-0" id="season-marker"></div>
                                                    ${item.seasons.map((s, idx) => `
                                                        <button onclick="Views.switchSeason('${s.id}', '${item.id}', this)" 
                                                            class="season-btn relative z-10 px-6 py-2.5 text-sm md:text-base rounded-full transition-colors ${idx === 0 ? 'text-black active-season font-black' : 'text-gray-400 font-bold hover:text-white'}" 
                                                            data-id="${s.id}">${s.title}</button>
                                                    `).join('')}
                                                </div>` : ''}
                                            </div>
                                            <div id="episodes-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 xl:grid-cols-2 2xl:grid-cols-2 gap-6 w-full py-4">
                                                ${initialEpisodesHtml}
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>`;
            },

            episodeRow(ep) {
                let progress = 0;
                if (window.userLibrary && window.userLibrary.history) {
                    const h = window.userLibrary.history.find(x => x.episodeId === ep.id || x.id === ep.id);
                    if (h && h.progress > 0) {
                        progress = h.progress;
                    }
                }
                if (!progress) {
                    progress = localStorage.getItem(`prog_${ep.id}`) || 0;
                }

                return `
                <div onclick="Router.go('player', {id: '${ep.id}', type: 'episode'})" 
                    class="group relative flex flex-col bg-white/5 border border-white/5 rounded-2xl overflow-hidden cursor-pointer hover:bg-white/10 transition-all duration-300 hover:scale-[1.02] hover:shadow-[0_10px_20px_rgba(0,0,0,0.5)]">
                    
                    <div class="relative w-full aspect-video overflow-hidden">
                        <img src="${ep.image || ep.thumbnail || ep.poster || ep.seasonPoster || ep.seriesPoster || '/uploads/default_ep.jpg'}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-80 group-hover:opacity-100">
                        
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-black/40">
                            <div class="w-12 h-12 rounded-full bg-primary text-black flex items-center justify-center text-xl shadow-[0_0_15px_#1bd68e]">
                                <i class="fa-solid fa-play ml-1"></i>
                            </div>
                        </div>

                        <div class="absolute bottom-0 left-0 right-0 h-1.5 bg-gray-800/80 backdrop-blur-sm">
                            <div class="h-full bg-primary shadow-[0_0_10px_#1bd68e]" style="width: ${progress}%"></div>
                        </div>
                        
                        <span class="absolute bottom-3 right-3 bg-black/60 backdrop-blur-md text-white text-[10px] px-2 py-1 rounded-md font-bold border border-white/10">
                            ${ep.duration || '00:00:00'}
                        </span>
                    </div>

                    <div class="p-3 text-right">
                        <div class="flex items-center justify-end gap-2 mb-1">
                            <span class="text-[10px] font-bold text-primary">EP ${ep.episodeNumber}</span>
                            ${progress > 90 ? '<i class="fa-solid fa-check-circle text-primary text-[10px]" title="تمت المشاهدة"></i>' : ''}
                        </div>
                        <h4 class="text-white font-bold text-sm truncate mb-1 group-hover:text-primary transition-colors">
                            ${ep.title || `الحلقة ${ep.episodeNumber}`}
                        </h4>
                        <p class="text-gray-500 text-[10px] line-clamp-2 leading-tight">
                            ${ep.description || 'الحلقة متوفرة ويمكن مشاهدتها'}
                        </p>
                    </div>
                </div>
                `;
            },

            async switchSeason(seasonId, seriesId, btn) {
                const marker = document.getElementById('season-marker');
                const container = document.getElementById('episodes-container');

                if (marker && btn) {
                    marker.style.width = `${btn.offsetWidth}px`;
                    marker.style.height = `${btn.offsetHeight}px`;
                    const offsetR = btn.parentElement.offsetWidth - (btn.offsetLeft + btn.offsetWidth);
                    marker.style.right = `${offsetR}px`;
                    marker.style.top = `${btn.offsetTop}px`;
                }

                document.querySelectorAll('.season-btn').forEach(b => {
                    b.classList.remove('text-black', 'active-season');
                    b.classList.add('text-gray-500');
                });
                btn.classList.add('text-black', 'active-season');
                btn.classList.remove('text-gray-500');

                container.style.opacity = '0.3';
                const res = await fetch(`${API_BASE}/episodes?seriesId=${seriesId}&seasonId=${seasonId}`);
                const eps = await res.json();
                container.innerHTML = eps.map(e => Views.episodeRow(e)).join('');
                container.style.opacity = '1';
            },


            initSeasonMarker() {
                setTimeout(() => {
                    const firstBtn = document.querySelector('.active-season');
                    if (firstBtn) {
                        firstBtn.click();
                    }
                }, 150);
            },

            async actor(id) {
                const actor = await fetch(`${API_BASE}/actors/${id}`).then(r => r.json());


                return `
                    <div class="min-h-screen px-6 py-32 lg:pr-40 container-custom">
                        <div class="flex flex-col md:flex-row-reverse gap-16 mb-24 items-center md:items-start text-right">
                            <div class="w-64 md:w-96 shrink-0 relative group">
                                <div class="absolute inset-0 bg-primary rounded-full blur-3xl opacity-10"></div>
                                <img src="${actor.image}" class="w-full aspect-square object-cover rounded-full border-8 border-surface shadow-2xl relative z-10">
                            </div>
                            <div class="flex-1">
                                <h1 class="text-5xl lg:text-7xl font-black mb-8 tracking-tighter leading-none">${actor.name}</h1>
                                <div class="flex flex-wrap justify-end gap-6 mb-10 text-gray-400 font-black uppercase text-sm tracking-widest">
                                    <span class="flex items-center gap-3">${actor.nationality || 'غير معروف'} <i class="fa-solid fa-flag text-primary"></i></span>
                                    <span class="flex items-center gap-3">${actor.birthDate ? new Date(actor.birthDate).getFullYear() : '---'} <i class="fa-solid fa-cake-candles text-primary"></i></span>
                                </div>
                                <p class="text-gray-400 text-xl leading-relaxed font-light mb-12 max-w-4xl mr-0 ml-auto opacity-80">${actor.bio || 'لا توجد سيرة ذاتية متوفرة.'}</p>
                            </div>
                        </div>
                        <section>
                            <div class="w-1.5 h-10 bg-primary rounded-full"></div><h2 class="text-3xl font-black mb-12 text-right flex items-center justify-end gap-5">اعمال ${actor.name}</h2>
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-7 gap-6">
                                ${[...(actor.movies || []), ...(actor.series || [])].map(m => UI.card(m)).join('')}
                            </div>
                        </section>
                    </div>`;
            },
            async player(id, type) {
                let info = {};
                let nextEps = [];
                let seasons = [];
                let series = null;
                let collectionItems = [];
                if (type === 'movie') {
                    const item = await fetch(`${API_BASE}/series/${id}`).then(r => r.json());
                    if (item.error) return Views.accessDenied(item.error);
                    info = { id: item.id, title: item.title, sub: 'فيلم', url: item.videoUrl, desc: item.description, poster: item.poster, rating: item.rating, year: item.year, collectionInfo: item.collectionInfo };

                    if (info.collectionInfo) {
                        try {
                            const colRes = await fetch(`${API_BASE}/collections/${info.collectionInfo.id}`);
                            const colData = await colRes.json();
                            collectionItems = colData.items || [];
                        } catch (e) { console.error('Failed to fetch collection', e); }
                    }
                } else {
                    const ep = await fetch(`${API_BASE}/episodes/${id}`).then(r => r.json());
                    if (ep.error) return Views.accessDenied(ep.error);
                    series = await fetch(`${API_BASE}/series/${ep.seriesId}`).then(r => r.json());
                    info = {
                        id: ep.id,
                        title: series.title,
                        sub: `الحلقة ${ep.episodeNumber}: ${ep.title}`,
                        url: ep.videoUrl,
                        desc: ep.description || series.description,
                        poster: ep.thumbnail || series.poster,
                        seriesId: ep.seriesId,
                        seasonId: ep.seasonId,
                        episodeNumber: ep.episodeNumber,
                        rating: series.rating,
                        year: series.year
                    };
                    let allEps = [];
                    try {
                        const epsRes = await fetch(`${API_BASE}/episodes?seriesId=${ep.seriesId}${ep.seasonId ? `&seasonId=${ep.seasonId}` : ''}`);
                        allEps = await epsRes.json();
                    } catch (e) { console.error('Failed to fetch episodes', e); }

                    nextEps = allEps.filter(e => e.episodeNumber > info.episodeNumber);

                    if (nextEps.length === 0 && series.seasons && series.seasons.length > 0) {
                        const currentSeason = series.seasons.find(s => s.id === ep.seasonId);
                        if (currentSeason) {
                            const nextSeason = series.seasons.find(s => s.seasonNumber === currentSeason.seasonNumber + 1);
                            if (nextSeason) {
                                try {
                                    const nextRes = await fetch(`${API_BASE}/episodes?seriesId=${ep.seriesId}&seasonId=${nextSeason.id}`);
                                    const nextSeasonEps = await nextRes.json();
                                    nextEps = nextSeasonEps.slice(0, 5);
                                } catch (e) { }
                            }
                        }
                    }

                    if (series.seasons) {
                        seasons = series.seasons.filter(s => s.id !== ep.seasonId);
                    }
                }

                const actionId = type === 'movie' ? info.id : info.seriesId;
                const actionType = type === 'movie' ? 'movie' : 'series';

                return `
        <div class="min-h-screen bg-[#020202] text-right" data-vid="${info.id}" data-type="${type}" data-series="${info.seriesId || ''}" data-season="${info.seasonId || ''}" data-episode="${info.episodeNumber || ''}" data-collection="${info.collectionInfo ? info.collectionInfo.id : ''}">
            
            <div class="max-w-[1920px] mx-auto flex flex-col lg:flex-row lg:h-screen overflow-hidden">
                
                
                <div class="w-full lg:w-[65%] flex flex-col h-full bg-black lg:border-r border-white/5 overflow-y-auto no-scrollbar">
                    
                    
                    <div id="p-container" class="ultra-player-container relative w-full aspect-video bg-black group overflow-hidden shrink-0 shadow-[0_20px_100px_rgba(0,0,0,1)]">
                        
                        <!-- Interaction Layers (3 Zones: 40/20/40) -->
                        <div id="zone-left" class="seek-zone seek-zone-left">
                            <div id="seek-indicator-left" class="seek-indicator left-1/4">
                                <i class="fa-solid fa-backward"></i>
                                <span class="text-xs mt-1 font-bold">-10s</span>
                            </div>
                        </div>
                        <div id="zone-center" class="interaction-center-zone"></div>
                        <div id="zone-right" class="seek-zone seek-zone-right">
                            <div id="seek-indicator-right" class="seek-indicator left-3/4">
                                <i class="fa-solid fa-forward"></i>
                                <span class="text-xs mt-1 font-bold">+10s</span>
                            </div>
                        </div>

                        <!-- UI Overlay (Topmost Layer) -->
                        <div id="player-ui-overlay" class="custom-player-ui absolute inset-0 z-[300] pointer-events-none opacity-0">
                            
                            <!-- Top Bar -->
                            <div class="player-top-bar absolute top-0 left-0 right-0 h-24 flex items-center justify-between px-10 pointer-events-auto">
                                <button onclick="window.history.back()" class="text-white/60 hover:text-primary text-2xl transition-colors">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </button>
                                <div class="text-center">
                                    <h2 class="text-white font-black text-xl md:text-2xl">${info.title}</h2>
                                    <p class="text-primary/70 font-bold text-[10px] tracking-widest uppercase">${info.sub}</p>
                                </div>
                                <button onclick="PlayerEngine.toggleSettings()" class="text-white/60 hover:text-primary text-2xl transition-colors">
                                    <i class="fa-solid fa-gear"></i>
                                </button>
                            </div>

                            <!-- Center Buttons -->
                            <div class="netflix-center-controls pointer-events-none">
                                <button class="center-btn pointer-events-auto" onclick="PlayerEngine.skipBackward()">
                                    <i class="fa-solid fa-rotate-left"></i>
                                </button>
                                <button class="center-btn main-play mx-8 pointer-events-auto" onclick="PlayerEngine.playPause()">
                                    <i id="center-play-icon" class="fa-solid fa-play ml-2"></i>
                                </button>
                                <button class="center-btn pointer-events-auto" onclick="PlayerEngine.skipForward()">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </button>
                            </div>

                    const res = await fetch(`${API_BASE}/episodes?seriesId=${seriesId}&seasonId=${seasonId}`);

                    container.innerHTML = eps.map(e => `
                        <div onclick="Router.go('player', {id: '${e.id}', type: 'episode'})"

                        return `

                        html += i.seasons.map(s => UI.seasonCard(s, i.title, i.rating)).join('');

                    return html;

        Views.loadConversations = async function() {
            try {
                const res = await fetch(`${API_BASE}/social/conversations?userId=${currentSession.userId}`);
                const convs = await res.json();
                
                const listEl = document.getElementById('conversations-list');
                if (!listEl) return;
                
                if (convs.length === 0) {
                    listEl.innerHTML = `<div class="text-gray-500 text-center py-10 font-bold text-sm">لا توجد محادثات نشطة</div>`;
                    return;
                }
                
                listEl.innerHTML = convs.map(c => {
                    let avatarHtml = '';
                    if (c.isGroup) {
                        if (c.avatar && c.avatar.startsWith('gradient:')) {
                            const gradClass = c.avatar.replace('gradient:', '');
                            avatarHtml = `<div class="w-12 h-12 rounded-2xl bg-gradient-to-r ${gradClass} flex items-center justify-center text-lg font-bold">👥</div>`;
                        } else {
                            avatarHtml = `<div class="w-12 h-12 rounded-2xl bg-primary/20 text-primary flex items-center justify-center text-lg font-bold">${c.avatar || '🍿'}</div>`;
                        }
                    } else {
                        avatarHtml = `<img src="${c.avatar || '/uploads/users/default.png'}" class="w-12 h-12 rounded-2xl object-cover">`;
                    }
                    
                    const lastMsgText = c.lastMessage ? (c.lastMessage.messageType === 'image' ? '📷 صورة' : (c.lastMessage.messageType === 'media' ? '🎬 بطاقة محتوى' : c.lastMessage.content)) : 'لا توجد رسائل بعد';
                    const unreadBadge = c.unreadCount > 0 ? `<span class="bg-primary text-black font-bold text-xs w-5 h-5 rounded-full flex items-center justify-center animate-pulse">${c.unreadCount}</span>` : '';
                    
                    const isActive = Views.currentConversationId === c.id;
                    
                    return `
                        <div onclick="Views.selectConversation('${c.id}')" class="flex items-center justify-between p-3 rounded-2xl cursor-pointer hover:bg-white/5 transition-all duration-300 ${isActive ? 'bg-white/10 border-r-4 border-primary' : 'border-r-4 border-transparent'}">
                            <div class="flex items-center gap-3 flex-1 min-w-0">
                                ${avatarHtml}
                                <div class="flex-1 min-w-0 text-right">
                                    <h4 class="font-bold text-white truncate text-sm">${c.name}</h4>
                                    <p class="text-xs text-gray-400 truncate mt-1">${lastMsgText}</p>
                                </div>
                            </div>
                            <div class="flex flex-col items-end justify-between h-10 mr-2 flex-shrink-0">
                                <span class="text-[10px] text-gray-500">${c.lastMessage ? new Date(c.lastMessage.createdAt).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) : ''}</span>
                                ${unreadBadge}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading conversations', error);
            }
        };

        Views.selectConversation = async function(conversationId) {
            Views.currentConversationId = conversationId;
            
            document.getElementById('no-chat-screen').classList.add('hidden');
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('chat-messages').classList.remove('hidden');
            document.getElementById('chat-input-container').classList.remove('hidden');
            
            window.socket.emit('join_conversation', conversationId);
            
            try {
                const res = await fetch(`${API_BASE}/social/conversations?userId=${currentSession.userId}`);
                const convs = await res.json();
                const c = convs.find(x => x.id === conversationId);
                if (c) {
                    const nameEl = document.getElementById('chat-header-name');
                    const statusEl = document.getElementById('chat-header-status');
                    const avatarEl = document.getElementById('chat-header-avatar');
                    
                    nameEl.innerText = c.name;
                    Views.currentConversationIsGroup = !!c.isGroup;
                    if (c.isGroup) {
                        statusEl.innerText = `${c.members.length} عضو`;
                    } else {
                        const other = c.members.find(m => m.id !== currentSession.userId);
                        statusEl.innerText = other ? `@${other.username}` : 'دردشة ثنائية مشفرة';
                    }
                    
                    if (c.isGroup) {
                        avatarEl.className = "w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-bold shadow-lg overflow-hidden";
                        if (c.avatar && c.avatar.startsWith('gradient:')) {
                            const gradClass = c.avatar.replace('gradient:', '');
                            avatarEl.className += ` bg-gradient-to-r ${gradClass}`;
                            avatarEl.innerHTML = '👥';
                        } else {
                            avatarEl.className += " bg-primary/20 text-primary";
                            avatarEl.innerHTML = c.avatar || '🍿';
                        }
                    } else {
                        avatarEl.innerHTML = `<img src="${c.avatar || '/uploads/users/default.png'}" class="w-full h-full object-cover">`;
                    }
                }
                
                document.getElementById('social-sidebar').classList.add('hidden', 'md:flex');
                document.getElementById('social-sidebar').classList.remove('w-full');
                document.getElementById('social-chat-area').classList.remove('hidden');
                
                await Views.loadMessages(conversationId);
                Views.loadConversations();
            } catch (e) {
                console.error('Error selecting conversation', e);
            }
        };

        Views.closeChatMobile = function() {
            Views.currentConversationId = null;
            document.getElementById('social-sidebar').classList.remove('hidden', 'md:flex');
            document.getElementById('social-sidebar').classList.add('w-full');
            document.getElementById('social-chat-area').classList.add('hidden');
            document.getElementById('no-chat-screen').classList.remove('hidden');
            document.getElementById('chat-header').classList.add('hidden');
            document.getElementById('chat-messages').classList.add('hidden');
            document.getElementById('chat-input-container').classList.add('hidden');
        };

        Views.loadMessages = async function(conversationId) {
            try {
                const res = await fetch(`${API_BASE}/social/conversations/${conversationId}/messages`);
                const messages = await res.json();
                
                const msgContainer = document.getElementById('chat-messages');
                if (!msgContainer) return;
                
                if (messages.length === 0) {
                    msgContainer.innerHTML = `<div class="text-gray-500 text-center py-20 font-bold text-sm">أرسل رسالة لبدء المحادثة</div>`;
                    return;
                }
                
                msgContainer.innerHTML = messages.map(msg => Views.renderMessageRow(msg)).join('');
                Views.scrollToBottom();
                
                // Bind touch gestures to message rows
                messages.forEach(msg => {
                    if (msg.messageType !== 'deleted') {
                        const el = msgContainer.querySelector(`.message-row[data-message-id="${msg.id}"]`);
                        if (el) {
                            Views.bindSwipeToReply(el, msg.id, msg.senderName || msg.senderUsername, msg.messageType === 'text' ? msg.content : 'ملف وسائط', false);
                        }
                    }
                });
                
                const unseen = messages.filter(m => m.senderId !== currentSession.userId && !m.seenBy.find(s => s.userId === currentSession.userId));
                for (const m of unseen) {
                    await fetch(`${API_BASE}/social/messages/${m.id}/seen`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: currentSession.userId })
                    });
                }
            } catch (error) {
                console.error('Error loading messages', error);
            }
        };

        Views.canDeleteMessage = function(msg) {
            if (msg.messageType === 'deleted') return false;
            if (msg.senderId !== currentSession.userId) return false;
            
            const isGroup = Views.currentConversationId ? Views.currentConversationIsGroup : Views.drawerCurrentConversationIsGroup;
            const seenByOthers = msg.seenBy ? msg.seenBy.filter(s => s.userId !== currentSession.userId) : [];
            const hasBeenSeen = seenByOthers.length > 0;
            
            const elapsedMs = Date.now() - new Date(msg.createdAt).getTime();
            const elapsedMinutes = elapsedMs / (1000 * 60);
            
            if (!isGroup) {
                if (hasBeenSeen) {
                    return elapsedMinutes <= 3;
                } else {
                    return elapsedMinutes <= 15;
                }
            } else {
                if (hasBeenSeen) {
                    return elapsedMinutes <= 5;
                } else {
                    return elapsedMinutes <= 20;
                }
            }
        };

        Views.renderMessageRow = function(msg) {
            const isMe = msg.senderId === currentSession.userId;
            
            let replyHtml = '';
            if (msg.replyToId) {
                replyHtml = `
                    <div class="mb-2 p-2 rounded-lg bg-black/20 border-r-2 border-primary text-xs max-w-xs text-right">
                        <p class="font-bold text-primary">${msg.replySenderName || 'مستخدم'}:</p>
                        <p class="text-gray-300 truncate">${msg.replyContent || '📷 صورة / 🎬 محتوى'}</p>
                    </div>
                `;
            }
            
            let contentHtml = '';
            if (msg.messageType === 'deleted') {
                contentHtml = `<p class="text-xs italic opacity-60 flex items-center gap-1.5 justify-end"><i class="fa-solid fa-ban text-[10px]"></i> <span>تم حذف هذه الرسالة</span></p>`;
            } else if (msg.messageType === 'image') {
                contentHtml = `<img src="${msg.content}" class="max-w-[240px] md:max-w-[320px] rounded-2xl border border-white/10 hover:opacity-90 cursor-pointer object-cover shadow-md" onclick="window.open('${msg.content}')">`;
            } else if (msg.messageType === 'media') {
                let cardObj = null;
                try { cardObj = JSON.parse(msg.content); } catch (e) {}
                if (cardObj) {
                    contentHtml = `
                        <div onclick="Router.go('details', { id: '${cardObj.id}' })" class="w-52 bg-card rounded-2xl overflow-hidden border border-white/10 hover:border-primary/50 transition-all cursor-pointer shadow-lg group">
                            <img src="${cardObj.poster || '/uploads/posters/default.png'}" class="w-full h-32 object-cover group-hover:scale-105 transition-transform duration-300">
                            <div class="p-3 text-right">
                                <h5 class="font-bold text-white text-xs truncate">${cardObj.title}</h5>
                                <p class="text-[10px] text-primary font-semibold mt-1">${cardObj.type === 'movie' ? '🎬 فيلم' : '📺 مسلسل'}</p>
                            </div>
                        </div>
                    `;
                } else {
                    contentHtml = `<p class="text-sm font-bold text-red-400">عنصر مشترك مفقود</p>`;
                }
            } else {
                contentHtml = `<p class="text-sm leading-relaxed">${Views.escapeHtml(msg.content)}</p>`;
            }
            
            let reactionsHtml = '';
            if (msg.messageType !== 'deleted' && msg.reactions && msg.reactions.length > 0) {
                const counts = {};
                msg.reactions.forEach(r => counts[r.emoji] = (counts[r.emoji] || 0) + 1);
                reactionsHtml = `
                    <div class="flex flex-row-reverse gap-1 mt-1 flex-wrap">
                        ${Object.keys(counts).map(emoji => `
                            <span onclick="Views.reactToMessage('${msg.id}', '${emoji}')" class="bg-white/10 backdrop-blur-md border border-white/5 rounded-full px-2 py-0.5 text-xs cursor-pointer hover:bg-white/20 select-none transition-all">${emoji} <span class="text-[10px] opacity-80">${counts[emoji]}</span></span>
                        `).join('')}
                    </div>
                `;
            }
            
            let seenHtml = '';
            if (isMe && msg.seenBy && msg.seenBy.length > 0) {
                seenHtml = `
                    <div class="text-[10px] text-gray-500 mt-1 flex items-center justify-end gap-1">
                        <i class="fa-solid fa-check-double text-primary"></i>
                        <span>شوهد</span>
                    </div>
                `;
            } else if (isMe) {
                seenHtml = `
                    <div class="text-[10px] text-gray-500 mt-1 flex items-center justify-end gap-1">
                        <i class="fa-solid fa-check"></i>
                        <span>أُرسل</span>
                    </div>
                `;
            }
            
            const rowClass = isMe ? 'justify-end' : 'justify-start';
            const bubbleClass = isMe 
                ? 'bg-gradient-to-l from-primary to-[#16ab72] text-black rounded-r-3xl rounded-tl-3xl shadow-[0_4px_15px_rgba(27,214,142,0.15)]' 
                : 'bg-white/5 border border-white/10 text-white rounded-l-3xl rounded-tr-3xl';
                
            const formattedTime = new Date(msg.createdAt).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
            
            let actionButtonsHtml = '';
            if (msg.messageType !== 'deleted') {
                actionButtonsHtml += `
                    <button onclick="Views.setReplyingTo('${msg.id}', '${msg.senderName || msg.senderUsername}', '${msg.messageType === 'text' ? msg.content.replace(/'/g, "\\'") : 'ملف وسائط'}')" class="opacity-0 group-hover:opacity-100 transition-opacity hover:text-white" title="رد">
                        <i class="fa-solid fa-reply"></i>
                    </button>
                `;
                
                if (isMe && Views.canDeleteMessage(msg)) {
                    actionButtonsHtml += `
                        <button onclick="Views.deleteMessage('${msg.id}')" class="opacity-0 group-hover:opacity-100 transition-opacity hover:text-red-700 ml-2" title="حذف">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    `;
                }
            }
            
            const reactionPickerHtml = (msg.messageType !== 'deleted') ? `
                <div class="absolute top-1/2 -translate-y-1/2 ${isMe ? 'left-full ml-2' : 'right-full mr-2'} opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-card border border-white/10 rounded-full px-2 py-1 flex gap-1 z-30 shadow-xl hidden md:flex">
                    ${['❤️', '👍', '😂', '😮', '😢', '🔥'].map(emoji => `
                        <span onclick="Views.reactToMessage('${msg.id}', '${emoji}')" class="hover:scale-125 cursor-pointer select-none transition-transform">${emoji}</span>
                    `).join('')}
                </div>
            ` : '';
            
            return `
                <div class="flex ${rowClass} w-full group relative message-row mb-2 animate-slide-up" data-message-id="${msg.id}">
                    <div class="max-w-[75%] md:max-w-[60%] flex flex-col text-right animate-fade-in">
                        ${(!isMe && msg.senderName) ? `<span class="text-[10px] text-gray-500 font-bold mb-1 mr-2">${msg.senderName}</span>` : ''}
                        
                        <div class="p-4 ${bubbleClass} relative select-text transition-all duration-300">
                            ${replyHtml}
                            ${contentHtml}
                            
                            <div class="flex items-center justify-between gap-6 mt-2 opacity-60 text-[9px] ${isMe ? 'text-black' : 'text-gray-400'}">
                                <span>${formattedTime}</span>
                                <div class="flex items-center gap-2">
                                    ${actionButtonsHtml}
                                </div>
                            </div>
                        </div>
                        
                        ${reactionsHtml}
                        ${seenHtml}
                    </div>
                    
                    ${reactionPickerHtml}
                </div>
            `;
        };

        Views.escapeHtml = function(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };

        Views.scrollToBottom = function() {
            const container = document.getElementById('chat-messages');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        };

        Views.searchUser = async function() {
            const input = document.getElementById('user-search-input');
            if (!input) return;
            const username = input.value.trim();
            if (!username) return;
            
            const container = document.getElementById('search-result-container');
            container.innerHTML = `<div class="flex justify-center py-4"><div class="w-5 h-5 border-2 border-primary border-t-transparent rounded-full animate-spin"></div></div>`;
            container.classList.remove('hidden');
            
            try {
                const res = await fetch(`${API_BASE}/social/search?username=${encodeURIComponent(username)}&currentUserId=${currentSession.userId}`);
                if (!res.ok) {
                    const errData = await res.json();
                    container.innerHTML = `<div class="text-red-500 font-bold text-xs text-center py-2">${errData.error || 'المستخدم غير موجود'}</div>`;
                    return;
                }
                
                const data = await res.json();
                const u = data.user;
                const status = data.followStatus;
                
                let actionButton = '';
                if (status === 'mutual') {
                    actionButton = `<button onclick="Views.startDirectChat('${u.id}')" class="bg-primary hover:bg-white text-black font-bold text-xs py-2 px-4 rounded-xl transition-all">دردشة</button>`;
                } else if (status === 'following') {
                    actionButton = `<button onclick="Views.unfollowUser('${u.id}')" class="bg-white/10 hover:bg-red-500/20 hover:text-red-500 text-white font-bold text-xs py-2 px-4 rounded-xl transition-all">إلغاء المتابعة</button>`;
                } else if (status === 'follower' || status === 'none') {
                    actionButton = `<button onclick="Views.followUser('${u.id}')" class="bg-primary hover:bg-white text-black font-bold text-xs py-2 px-4 rounded-xl transition-all">متابعة</button>`;
                }
                
                const displayAvatar = u.isBlurred 
                    ? `<div class="w-10 h-10 rounded-xl overflow-hidden relative"><img src="${u.avatar || '/uploads/users/default.png'}" class="w-full h-full object-cover filter blur-[16px] pointer-events-none"></div>`
                    : `<img src="${u.avatar || '/uploads/users/default.png'}" class="w-10 h-10 rounded-xl object-cover">`;
                    
                const displayName = u.name;
                const displayUsername = u.isBlurred ? 'مجهول' : `@${u.username}`;
                
                container.innerHTML = `
                    <div class="flex items-center justify-between p-3 rounded-2xl bg-white/5 border border-white/10">
                        <div class="flex items-center gap-3">
                            ${displayAvatar}
                            <div class="text-right">
                                <h5 class="font-bold text-white text-sm">${displayName}</h5>
                                <p class="text-[10px] text-gray-400">${displayUsername}</p>
                            </div>
                        </div>
                        ${actionButton}
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `<div class="text-red-500 font-bold text-xs text-center py-2">حدث خطأ أثناء البحث</div>`;
            }
        };

        Views.followUser = async function(targetId) {
            try {
                const res = await fetch(`${API_BASE}/social/follow`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ followerId: currentSession.userId, followingId: targetId })
                });
                const data = await res.json();
                if (data.success) {
                    Views.searchUser();
                    Views.loadConversations();
                    if (data.isMutual) {
                        Views.startDirectChat(targetId);
                    }
                }
            } catch (error) {
                console.error('Error following user', error);
            }
        };
        
        Views.unfollowUser = async function(targetId) {
            try {
                const res = await fetch(`${API_BASE}/social/unfollow`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ followerId: currentSession.userId, followingId: targetId })
                });
                const data = await res.json();
                if (data.success) {
                    Views.searchUser();
                    Views.loadConversations();
                }
            } catch (error) {
                console.error('Error unfollowing user', error);
            }
        };
        
        Views.startDirectChat = async function(targetId) {
            try {
                const res = await fetch(`${API_BASE}/social/conversations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        isGroup: false,
                        createdById: currentSession.userId,
                        members: [currentSession.userId, targetId]
                    })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('user-search-input').value = '';
                    document.getElementById('search-result-container').classList.add('hidden');
                    await Views.selectConversation(data.conversationId);
                }
            } catch (error) {
                console.error('Error starting direct chat', error);
            }
        };

        Views.sendMessage = async function() {
            const input = document.getElementById('chat-message-input');
            if (!input) return;
            const text = input.value.trim();
            if (!text && !Views.pendingMediaAttachment) return;
            
            const payload = {
                senderId: currentSession.userId,
                messageType: 'text',
                content: text
            };
            
            if (Views.replyingToMsgId) {
                payload.replyToId = Views.replyingToMsgId;
            }
            
            if (Views.pendingMediaAttachment) {
                payload.messageType = 'media';
                payload.content = JSON.stringify(Views.pendingMediaAttachment);
                Views.pendingMediaAttachment = null;
            }
            
            input.value = '';
            Views.cancelReply();
            Views.handleMessageInputInput();
            
            try {
                const res = await fetch(`${API_BASE}/social/conversations/${Views.currentConversationId}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    Views.loadConversations();
                }
            } catch (e) {
                console.error('Error sending message', e);
            }
        };

        Views.handleMessageInputKeyUp = function(event) {
            if (event.key === 'Enter') {
                Views.sendMessage();
            }
        };
        
        Views.handleMessageInputInput = function() {
            if (!Views.currentConversationId) return;
            
            if (!Views.isTyping) {
                Views.isTyping = true;
                window.socket.emit('typing', {
                    conversationId: Views.currentConversationId,
                    userId: currentSession.userId,
                    username: currentSession.name || currentSession.username,
                    isTyping: true
                });
            }
            
            clearTimeout(Views.isTypingTimeout);
            Views.isTypingTimeout = setTimeout(() => {
                Views.isTyping = false;
                window.socket.emit('typing', {
                    conversationId: Views.currentConversationId,
                    userId: currentSession.userId,
                    username: currentSession.name || currentSession.username,
                    isTyping: false
                });
            }, 3000);
        };

        Views.setReplyingTo = function(messageId, username, contentText) {
            Views.replyingToMsgId = messageId;
            
            const bar = document.getElementById('reply-preview-bar');
            const userEl = document.getElementById('reply-username');
            const textEl = document.getElementById('reply-text');
            
            userEl.innerText = username;
            textEl.innerText = contentText;
            
            bar.classList.remove('hidden');
            document.getElementById('chat-message-input').focus();
        };
        
        Views.cancelReply = function() {
            Views.replyingToMsgId = null;
            const bar = document.getElementById('reply-preview-bar');
            if (bar) bar.classList.add('hidden');
        };

        Views.toggleAttachmentMenu = function() {
            const menu = document.getElementById('attachment-menu');
            if (menu) menu.classList.toggle('hidden');
        };
        
        Views.triggerImageUpload = function() {
            const input = document.getElementById('chat-image-file-input');
            if (input) input.click();
            Views.toggleAttachmentMenu();
        };
        
        Views.handleImageUpload = async function(input) {
            if (!input.files || input.files.length === 0) return;
            const file = input.files[0];
            
            const formData = new FormData();
            formData.append('image', file);
            formData.append('type', 'chat');
            
            const msgInput = document.getElementById('chat-message-input');
            msgInput.placeholder = 'جاري رفع الصورة...';
            msgInput.disabled = true;
            
            try {
                const res = await fetch(`${API_BASE}/social/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.success) {
                    const payload = {
                        senderId: currentSession.userId,
                        messageType: 'image',
                        content: data.filePath
                    };
                    
                    if (Views.replyingToMsgId) {
                        payload.replyToId = Views.replyingToMsgId;
                        Views.cancelReply();
                    }
                    
                    await fetch(`${API_BASE}/social/conversations/${Views.currentConversationId}/messages`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    Views.loadConversations();
                }
            } catch (e) {
                console.error('Error uploading image', e);
            } finally {
                msgInput.placeholder = 'اكتب رسالة...';
                msgInput.disabled = false;
                input.value = '';
            }
        };

        Views.openShareMediaModal = function() {
            document.getElementById('share-media-modal').classList.remove('hidden');
            Views.toggleAttachmentMenu();
            Views.searchShareMedia('');
        };
        
        Views.closeShareMediaModal = function() {
            document.getElementById('share-media-modal').classList.add('hidden');
        };
        
        Views.searchShareMedia = async function(query) {
            const container = document.getElementById('share-media-results');
            if (!container) return;
            
            container.innerHTML = `<div class="flex justify-center py-6"><div class="w-6 h-6 border-2 border-primary border-t-transparent rounded-full animate-spin"></div></div>`;
            
            try {
                const [moviesRes, seriesRes] = await Promise.all([
                    fetch(`/api/movies?search=${encodeURIComponent(query)}&limit=10`),
                    fetch(`/api/series?search=${encodeURIComponent(query)}&limit=10`)
                ]);
                
                const movies = await moviesRes.json();
                const series = await seriesRes.json();
                
                const movieItems = Array.isArray(movies) ? movies : (movies.items || []);
                const seriesItems = Array.isArray(series) ? series : (series.items || []);
                
                const merged = [
                    ...movieItems.map(m => ({ ...m, type: 'movie' })),
                    ...seriesItems.map(s => ({ ...s, type: 'series' }))
                ];
                
                if (merged.length === 0) {
                    container.innerHTML = `<div class="text-gray-500 text-center py-6">لم يتم العثور على نتائج</div>`;
                    return;
                }
                
                container.innerHTML = merged.map(item => `
                    <div onclick="Views.shareMediaItem('${item.id}', '${item.type}', '${item.title.replace(/'/g, "\\'")}', '${item.poster || ''}')" class="flex items-center gap-3 p-2 rounded-xl hover:bg-white/5 cursor-pointer transition-all border border-transparent hover:border-white/10 text-right">
                        <img src="${item.poster || '/uploads/posters/default.png'}" class="w-10 h-14 object-cover rounded-lg">
                        <div class="flex-1">
                            <h5 class="font-bold text-white text-xs">${item.title}</h5>
                            <p class="text-[10px] text-primary mt-1">${item.type === 'movie' ? '🎬 فيلم' : '📺 مسلسل'}</p>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `<div class="text-red-500 text-center py-6">حدث خطأ أثناء تحميل المحتوى</div>`;
            }
        };
        
        Views.shareMediaItem = async function(id, type, title, poster) {
            Views.closeShareMediaModal();
            if (Views.isDrawerSharing) {
                Views.drawerPendingMediaAttachment = { id, type, title, poster };
                Views.isDrawerSharing = false;
                await Views.sendDrawerMessage();
            } else {
                Views.pendingMediaAttachment = { id, type, title, poster };
                await Views.sendMessage();
            }
        };

        Views.openGroupModal = function() {
            document.getElementById('group-modal').classList.remove('hidden');
            document.getElementById('group-name-input').value = '';
            Views.selectedGroupIconType = 'emoji';
            Views.selectedGroupEmoji = '🍿';
            Views.selectedGroupColor = '';
            Views.selectedGroupMembers = [];
            
            document.getElementById('icon-type-emoji').className = "flex-1 py-2 rounded-xl border border-primary text-primary bg-primary/10 font-bold transition-all";
            document.getElementById('icon-type-color').className = "flex-1 py-2 rounded-xl border border-white/10 text-gray-400 font-bold hover:bg-white/5 transition-all";
            
            document.getElementById('group-emoji-selector').classList.remove('hidden');
            document.getElementById('group-color-selector').classList.add('hidden');
            
            document.querySelectorAll('.emoji-opt').forEach(el => el.classList.remove('bg-primary/20', 'border', 'border-primary'));
            document.querySelectorAll('.color-opt').forEach(el => el.classList.remove('border-primary'));
            
            Views.loadGroupFriends();
        };
        
        Views.closeGroupModal = function() {
            document.getElementById('group-modal').classList.add('hidden');
        };
        
        Views.setGroupIconType = function(type) {
            Views.selectedGroupIconType = type;
            const emojiBtn = document.getElementById('icon-type-emoji');
            const colorBtn = document.getElementById('icon-type-color');
            const emojiSel = document.getElementById('group-emoji-selector');
            const colorSel = document.getElementById('group-color-selector');
            
            if (type === 'emoji') {
                emojiBtn.className = "flex-1 py-2 rounded-xl border border-primary text-primary bg-primary/10 font-bold transition-all";
                colorBtn.className = "flex-1 py-2 rounded-xl border border-white/10 text-gray-400 font-bold hover:bg-white/5 transition-all";
                emojiSel.classList.remove('hidden');
                colorSel.classList.add('hidden');
            } else {
                colorBtn.className = "flex-1 py-2 rounded-xl border border-primary text-primary bg-primary/10 font-bold transition-all";
                emojiBtn.className = "flex-1 py-2 rounded-xl border border-white/10 text-gray-400 font-bold hover:bg-white/5 transition-all";
                colorSel.classList.remove('hidden');
                emojiSel.classList.add('hidden');
            }
        };
        
        Views.selectGroupEmoji = function(emoji, el) {
            Views.selectedGroupEmoji = emoji;
            document.querySelectorAll('.emoji-opt').forEach(x => x.classList.remove('bg-primary/20', 'border', 'border-primary'));
            el.classList.add('bg-primary/20', 'border', 'border-primary');
        };
        
        Views.selectGroupColor = function(color, el) {
            Views.selectedGroupColor = color;
            document.querySelectorAll('.color-opt').forEach(x => x.classList.remove('border-primary'));
            el.classList.add('border-primary');
        };
        
        Views.loadGroupFriends = async function() {
            const container = document.getElementById('group-members-list');
            container.innerHTML = `<div class="flex justify-center"><div class="w-5 h-5 border-2 border-primary border-t-transparent rounded-full animate-spin"></div></div>`;
            
            try {
                const res = await fetch(`${API_BASE}/social/friends?userId=${currentSession.userId}`);
                const friends = await res.json();
                
                if (friends.length === 0) {
                    container.innerHTML = `<p class="text-xs text-gray-500 text-center">يجب أن يكون لديك أصدقاء (متابعة متبادلة) لإضافتهم للمجموعة</p>`;
                    return;
                }
                
                container.innerHTML = friends.map(f => `
                    <label class="flex items-center justify-between p-2 rounded-lg hover:bg-white/5 cursor-pointer">
                        <div class="flex items-center gap-3">
                            <img src="${f.avatar || '/uploads/users/default.png'}" class="w-8 h-8 rounded-lg object-cover">
                            <div class="text-right">
                                <p class="font-bold text-xs text-white">${f.name || f.username}</p>
                                <p class="text-[9px] text-gray-500">@${f.username}</p>
                            </div>
                        </div>
                        <input type="checkbox" value="${f.id}" onchange="Views.toggleGroupMember('${f.id}', this.checked)" class="rounded border-white/10 text-primary focus:ring-primary">
                    </label>
                `).join('');
            } catch (e) {
                container.innerHTML = `<p class="text-xs text-red-500 text-center">حدث خطأ أثناء تحميل الأصدقاء</p>`;
            }
        };
        
        Views.toggleGroupMember = function(userId, isChecked) {
            if (isChecked) {
                if (!Views.selectedGroupMembers.includes(userId)) {
                    Views.selectedGroupMembers.push(userId);
                }
            } else {
                Views.selectedGroupMembers = Views.selectedGroupMembers.filter(x => x !== userId);
            }
        };
        
        Views.createGroup = async function() {
            const nameInput = document.getElementById('group-name-input');
            const name = nameInput.value.trim();
            const errorEl = document.getElementById('group-modal-error');
            
            errorEl.classList.add('hidden');
            
            if (!name) {
                errorEl.innerText = 'يرجى إدخال اسم المجموعة';
                errorEl.classList.remove('hidden');
                return;
            }
            
            if (Views.selectedGroupMembers.length < 2) {
                errorEl.innerText = 'يجب إضافة عضوين على الأقل لتكوين مجموعة (3 أعضاء بالإجمال)';
                errorEl.classList.remove('hidden');
                return;
            }
            
            const avatar = Views.selectedGroupIconType === 'emoji' 
                ? Views.selectedGroupEmoji 
                : `gradient:${Views.selectedGroupColor}`;
                
            try {
                const res = await fetch(`${API_BASE}/social/conversations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        isGroup: true,
                        name,
                        avatar,
                        createdById: currentSession.userId,
                        members: [...Views.selectedGroupMembers, currentSession.userId]
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    Views.closeGroupModal();
                    await Views.selectConversation(data.conversationId);
                } else {
                    errorEl.innerText = data.error || 'حدث خطأ أثناء إنشاء المجموعة';
                    errorEl.classList.remove('hidden');
                }
            } catch (e) {
                errorEl.innerText = 'حدث خطأ في الاتصال بالخادم';
                errorEl.classList.remove('hidden');
            }
        };

        Views.handleIncomingMessage = function(msg) {
            if (!Views.currentConversationId) return;
            
            if (msg.conversationId === Views.currentConversationId) {
                const container = document.getElementById('chat-messages');
                if (container) {
                    if (container.querySelector('.text-gray-500')) {
                        container.innerHTML = '';
                    }
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = Views.renderMessageRow(msg);
                    container.appendChild(tempDiv.firstElementChild);
                    Views.scrollToBottom();
                    
                    if (msg.senderId !== currentSession.userId) {
                        fetch(`${API_BASE}/social/messages/${msg.id}/seen`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: currentSession.userId })
                        });
                    }
                }
            }
        };
        
        Views.handleReactionUpdate = function({ messageId, reactions }) {
            const row = document.querySelector(`.message-row[data-message-id="${messageId}"]`);
            if (row) {
                let badgeContainer = row.querySelector('.flex-row-reverse');
                if (reactions.length === 0) {
                    if (badgeContainer) badgeContainer.remove();
                    return;
                }
                
                const counts = {};
                reactions.forEach(r => counts[r.emoji] = (counts[r.emoji] || 0) + 1);
                const newHtml = `
                    <div class="flex flex-row-reverse gap-1 mt-1 flex-wrap">
                        ${Object.keys(counts).map(emoji => `
                            <span onclick="Views.reactToMessage('${messageId}', '${emoji}')" class="bg-white/10 backdrop-blur-md border border-white/5 rounded-full px-2 py-0.5 text-xs cursor-pointer hover:bg-white/20 select-none transition-all">${emoji} <span class="text-[10px] opacity-80">${counts[emoji]}</span></span>
                        `).join('')}
                    </div>
                `;
                
                if (badgeContainer) {
                    badgeContainer.outerHTML = newHtml;
                } else {
                    const bubbleWrapper = row.firstElementChild;
                    const bubble = bubbleWrapper.querySelector('.rounded-tr-3xl, .rounded-tl-3xl');
                    bubble.insertAdjacentHTML('afterend', newHtml);
                }
            }
        };
        
        Views.handleSeenUpdate = function({ messageId, seenBy }) {
            const row = document.querySelector(`.message-row[data-message-id="${messageId}"]`);
            if (row) {
                const seenStatusContainer = row.querySelector('.text-\\[10px\\]');
                if (seenStatusContainer && seenBy.length > 0) {
                    seenStatusContainer.innerHTML = `
                        <i class="fa-solid fa-check-double text-primary"></i>
                        <span>شوهد</span>
                    `;
                }
            }
        };
        
        Views.handleTypingUpdate = function({ conversationId, userId, username, isTyping }) {
            if (Views.currentConversationId !== conversationId) return;
            
            const indicator = document.getElementById('typing-indicator');
            if (!indicator) return;
            
            if (isTyping) {
                indicator.innerText = `${username} يكتب الآن...`;
                indicator.classList.remove('hidden');
            } else {
                indicator.classList.add('hidden');
            }
        };
        
        Views.reactToMessage = async function(messageId, emoji) {
            try {
                await fetch(`${API_BASE}/social/messages/${messageId}/react`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentSession.userId, emoji })
                });
            } catch (e) {
                console.error('Error toggling reaction', e);
            }
        };
        
        Views.initSocial = function() {
            if (!window.socket) {
                window.socket = io();
                
                window.socket.on('new_message', (msg) => {
                    Views.handleIncomingMessage(msg);
                });
                
                window.socket.on('message_reaction_updated', (data) => {
                    Views.handleReactionUpdate(data);
                });
                
                window.socket.on('message_seen_updated', (data) => {
                    Views.handleSeenUpdate(data);
                });
                
                window.socket.on('user_typing', (data) => {
                    Views.handleTypingUpdate(data);
                });
                
                window.socket.on('new_conversation', (data) => {
                    Views.loadConversations();
                });
            }
            
            if (currentSession) {
                window.socket.emit('join_user', currentSession.userId);
            }
            
            Views.currentConversationId = null;
            Views.pendingMediaAttachment = null;
            
            Views.closeGroupModal();
            Views.closeShareMediaModal();
            Views.cancelReply();
            Views.loadConversations();
        };

        Views.selectDrawerConversation = async function(conversationId, isGroup) {
            Views.drawerCurrentConversationId = conversationId;
            Views.drawerCurrentConversationIsGroup = !!isGroup;
            
            const activeChat = document.getElementById('drawer-active-chat');
            activeChat.classList.remove('hidden');
            void activeChat.offsetWidth;
            activeChat.classList.add('open');
            
            window.socket.emit('join_conversation', conversationId);
            
            try {
                const res = await fetch(`${API_BASE}/social/conversations?userId=${currentSession.userId}`);
                const convs = await res.json();
                const c = convs.find(x => x.id === conversationId);
                if (c) {
                    const nameEl = document.getElementById('drawer-chat-name');
                    const statusEl = document.getElementById('drawer-chat-status');
                    const avatarEl = document.getElementById('drawer-chat-avatar');
                    
                    if (!c.isGroup) {
                        const other = c.members.find(m => m.id !== currentSession.userId);
                        nameEl.innerText = c.name;
                        statusEl.innerText = other ? `@${other.username}` : 'دردشة ثنائية مشفرة';
                    } else {
                        nameEl.innerText = c.name;
                        statusEl.innerText = `${c.members.length} عضو`;
                    }
                    
                    if (c.isGroup) {
                        avatarEl.className = "w-8 h-8 rounded-lg overflow-hidden flex-shrink-0 flex items-center justify-center text-sm font-bold";
                        if (c.avatar && c.avatar.startsWith('gradient:')) {
                            const gradClass = c.avatar.replace('gradient:', '');
                            avatarEl.className += ` bg-gradient-to-r ${gradClass}`;
                            avatarEl.innerHTML = '👥';
                        } else {
                            avatarEl.className += " bg-primary/20 text-primary";
                            avatarEl.innerHTML = c.avatar || '🍿';
                        }
                    } else {
                        avatarEl.className = "w-8 h-8 rounded-lg overflow-hidden flex-shrink-0";
                        avatarEl.innerHTML = `<img src="${c.avatar || '/uploads/users/default.png'}" class="w-full h-full object-cover">`;
                    }
                }
                
                await Views.loadDrawerMessages(conversationId);
                Views.loadDrawerConversations();
            } catch (e) {
                console.error('Error selecting drawer conversation', e);
            }
        };

        Views.closeDrawerChat = function() {

                activeChat.classList.remove('open');
                setTimeout(() => activeChat.classList.add('hidden'), 300);

        Views.loadDrawerMessages = async function(conversationId) {
            try {
                const res = await fetch(`${API_BASE}/social/conversations/${conversationId}/messages`);
                const messages = await res.json();
                
                const container = document.getElementById('drawer-chat-messages');
                if (!container) return;
                
                if (messages.length === 0) {
                    container.innerHTML = `<div class="text-gray-500 text-center py-10 font-bold text-xs">أرسل رسالة لبدء المحادثة</div>`;
                    return;
                }
                
                container.innerHTML = messages.map(msg => Views.renderDrawerMessageRow(msg)).join('');
                container.scrollTop = container.scrollHeight;
                
                messages.forEach(msg => {
                    if (msg.messageType !== 'deleted') {
                        const el = container.querySelector(`.message-row[data-message-id="${msg.id}"]`);
                        if (el) {
                            Views.bindSwipeToReply(el, msg.id, msg.senderName || msg.senderUsername, msg.messageType === 'text' ? msg.content : 'ملف وسائط', true);
                        }
                    }
                });
                
                const unseen = messages.filter(m => m.senderId !== currentSession.userId && !m.seenBy.find(s => s.userId === currentSession.userId));
                for (const m of unseen) {
                    await fetch(`${API_BASE}/social/messages/${m.id}/seen`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: currentSession.userId })
                    });
                }
            } catch (e) {
                console.error('Error loading drawer messages', e);
            }
        };

        Views.renderDrawerMessageRow = function(msg) {

            let replyHtml = '';
            if (msg.replyToId) {
                replyHtml = `
                    <div class="mb-1.5 p-1.5 rounded-lg bg-black/20 border-r-2 border-primary text-[10px] max-w-xs text-right">
                        <p class="font-bold text-primary">${msg.replySenderName || 'مستخدم'}:</p>
                        <p class="text-gray-300 truncate">${msg.replyContent || '📷 صورة / 🎬 محتوى'}</p>

            } else if (msg.messageType === 'image') {
                contentHtml = `<img src="${msg.content}" class="max-w-[180px] rounded-xl border border-white/10 hover:opacity-90 cursor-pointer object-cover shadow-sm" onclick="window.open('${msg.content}')">`;
            } else if (msg.messageType === 'media') {
                let cardObj = null;
                try { cardObj = JSON.parse(msg.content); } catch (e) {}
                if (cardObj) {
                    contentHtml = `
